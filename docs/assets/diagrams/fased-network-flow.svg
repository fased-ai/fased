<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" role="img" aria-labelledby="title desc">
<title id="title">Fased trading network</title>
<desc id="desc">Approved future roadmap. Humans and agents publish signals and research to Fased Network. WEN, Fased App and Fcode API clients consume them. Fased trading passes owner limits and a separate signer. Sharing outcomes is optional. Network participation grants no wallet or WEN reward authority.</desc>
