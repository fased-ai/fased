name: Pre-candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact unversioned protected-main source commit to validate
        required: true
        type: string
      next_release_version:
        description: Unused candidate version reserved only after this run passes
        required: true
        type: string
      predecessor_version:
        description: Supported public stable predecessor for packaged P1
        required: true
        type: string
      managed_predecessor_version:
        description: Representative supported pre-bootstrap managed predecessor
        required: true
        type: string
      release_sequence:
        description: Next monotonic lifecycle release sequence
        required: true
        type: string
      security_epoch:
        description: Current lifecycle security epoch
        required: true
        type: string
      local0_receipt_sha256:
        description: Digest emitted by the exact local pre-candidate readiness check
        required: true
        type: string
      hosting_staging_receipt_sha256:
        description: Digest of the exact unpublished Hosting staging-VPS PASS receipt
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pre-candidate-${{ inputs.source_commit }}-${{ inputs.next_release_version }}-${{ inputs.managed_predecessor_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Validate source before allocating a candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact unversioned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.34.5"
          cache-key-suffix: "pre-candidate-node24"

      - name: Verify source and proposed release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          NEXT_RELEASE_VERSION: ${{ inputs.next_release_version }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          SECURITY_EPOCH: ${{ inputs.security_epoch }}
          LOCAL0_RECEIPT_SHA256: ${{ inputs.local0_receipt_sha256 }}
          HOSTING_STAGING_RECEIPT_SHA256: ${{ inputs.hosting_staging_receipt_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_COMMIT"
          [[ "$NEXT_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          [[ "$MANAGED_PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "$PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SECURITY_EPOCH" =~ ^[1-9][0-9]*$ ]]
          [[ "$LOCAL0_RECEIPT_SHA256" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$HOSTING_STAGING_RECEIPT_SHA256" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$NEXT_RELEASE_VERSION" != "$PREDECESSOR_VERSION"
          test "$NEXT_RELEASE_VERSION" != "$MANAGED_PREDECESSOR_VERSION"
          test "$(node -p "require('./package.json').version")" != "$NEXT_RELEASE_VERSION"
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$NEXT_RELEASE_VERSION" >/dev/null 2>&1
          ! gh release view "v$NEXT_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1

      - name: Verify immutable lifecycle root pin
        run: node scripts/verify-lifecycle-root-pin.mjs

      - name: Install exact frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce production vulnerability threshold
        run: pnpm audit --prod --audit-level high

      - name: Verify exact successful merged-main checks
        id: main-pass
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?head_sha=$SOURCE_COMMIT&branch=main&event=push&status=success&per_page=20"
          )"
          main_run_id="$(
            jq -er \
              --arg sourceCommit "$SOURCE_COMMIT" \
              '[.workflow_runs[] | select(.head_sha == $sourceCommit and .head_branch == "main" and .event == "push" and .conclusion == "success")] | sort_by(.run_number) | last | .id' \
              <<<"$runs"
          )"
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$main_run_id/jobs?per_page=100")"
          main_checks_job_id="$(
            jq -er \
              '[.jobs[] | select(.name == "checks" and .conclusion == "success")] | last | .id' \
              <<<"$jobs"
          )"
          printf 'run_id=%s\n' "$main_run_id" >>"$GITHUB_OUTPUT"
          printf 'checks_job_id=%s\n' "$main_checks_job_id" >>"$GITHUB_OUTPUT"

      - name: Verify public compatibility inventory
        env:
          GH_TOKEN: ${{ github.token }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lifecycle-compatibility-inventory.mjs --verify-git
          node scripts/lifecycle-compatibility-inventory.mjs --verify-release "$PREDECESSOR_VERSION"
          node scripts/lifecycle-compatibility-inventory.mjs --verify-release "$MANAGED_PREDECESSOR_VERSION"
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$PREDECESSOR_VERSION")"
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$MANAGED_PREDECESSOR_VERSION")"
          gh release view "v$MANAGED_PREDECESSOR_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Record immutable pre-candidate evidence
        env:
          MAIN_CHECKS_JOB_ID: ${{ steps.main-pass.outputs.checks_job_id }}
          MAIN_RUN_ID: ${{ steps.main-pass.outputs.run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          NEXT_RELEASE_VERSION: ${{ inputs.next_release_version }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          SECURITY_EPOCH: ${{ inputs.security_epoch }}
          LOCAL0_RECEIPT_SHA256: ${{ inputs.local0_receipt_sha256 }}
          HOSTING_STAGING_RECEIPT_SHA256: ${{ inputs.hosting_staging_receipt_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/pre-candidate
          node scripts/release-gate.mjs record \
            --phase pre-candidate \
            --source-commit "$SOURCE_COMMIT" \
            --source-tree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --lockfile-digest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --release-version "$NEXT_RELEASE_VERSION" \
            --claim "predecessorVersion=$PREDECESSOR_VERSION" \
            --claim "managedPredecessorVersion=$MANAGED_PREDECESSOR_VERSION" \
            --claim "releaseSequence=$RELEASE_SEQUENCE" \
            --claim "securityEpoch=$SECURITY_EPOCH" \
            --claim "mainRunId=$MAIN_RUN_ID" \
            --claim "mainChecksJobId=$MAIN_CHECKS_JOB_ID" \
            --claim "workflowRunId=$GITHUB_RUN_ID" \
            --claim "local0ReceiptDigest=$LOCAL0_RECEIPT_SHA256" \
            --claim "hostingStagingReceiptDigest=$HOSTING_STAGING_RECEIPT_SHA256" \
            --output .artifacts/pre-candidate/evidence.json

      - name: Upload pre-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-pre-candidate-evidence
          path: .artifacts/pre-candidate/evidence.json
          if-no-files-found: error
          retention-days: 30
