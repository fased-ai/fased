name: Pre-candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact unversioned protected-main source commit to validate
        required: true
        type: string
      next_release_version:
        description: Unused candidate version reserved only after this run passes
        required: true
        type: string
      predecessor_version:
        description: Supported public stable predecessor for packaged P1
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pre-candidate-${{ inputs.source_commit }}-${{ inputs.next_release_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Validate source before allocating a candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact unversioned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.34.5"
          cache-key-suffix: "pre-candidate-node24"

      - name: Verify source and proposed release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          NEXT_RELEASE_VERSION: ${{ inputs.next_release_version }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_COMMIT"
          [[ "$NEXT_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          [[ "$PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$NEXT_RELEASE_VERSION" != "$PREDECESSOR_VERSION"
          test "$(node -p "require('./package.json').version")" != "$NEXT_RELEASE_VERSION"
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$NEXT_RELEASE_VERSION" >/dev/null 2>&1
          ! gh release view "v$NEXT_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1

      - name: Install exact frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce production vulnerability threshold
        run: pnpm audit --prod --audit-level high

      - name: Verify public compatibility inventory
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lifecycle-compatibility-inventory.mjs --verify-public-github
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$PREDECESSOR_VERSION")"

      - name: Validate release contents
        run: pnpm release:check

      - name: Record immutable pre-candidate evidence
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          NEXT_RELEASE_VERSION: ${{ inputs.next_release_version }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/pre-candidate
          jq -n \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --arg lockfileDigest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --arg nextReleaseVersion "$NEXT_RELEASE_VERSION" \
            --arg predecessorVersion "$PREDECESSOR_VERSION" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            '{schemaVersion:1,sourceCommit:$sourceCommit,sourceTree:$sourceTree,lockfileDigest:$lockfileDigest,nextReleaseVersion:$nextReleaseVersion,predecessorVersion:$predecessorVersion,workflowRunId:$workflowRunId}' \
            >.artifacts/pre-candidate/evidence.json

      - name: Upload pre-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-pre-candidate-evidence
          path: .artifacts/pre-candidate/evidence.json
          if-no-files-found: error
          retention-days: 30
