name: Candidate P1 Replay

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed trusted release run containing the exact assembled candidate
        required: true
        type: string
      candidate_descriptor_sha256:
        description: Expected sha256 digest of fased-hosting-candidate.json
        required: true
        type: string
      release_version:
        description: Exact immutable candidate version from the source run
        required: true
        type: string
      source_commit:
        description: Exact immutable candidate commit from the source run
        required: true
        type: string
      predecessor_version:
        description: Supported stable predecessor
        required: true
        type: string
      managed_predecessor_version:
        description: Representative supported pre-bootstrap managed predecessor
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: candidate-p1-replay-${{ inputs.source_run_id }}-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify and stage exact candidate replay
    runs-on: ubuntu-24.04
    outputs:
      local_predecessors: ${{ steps.identity.outputs.local_predecessors }}
      hosting_predecessors: ${{ steps.identity.outputs.hosting_predecessors }}
    steps:
      - name: Checkout fixture correction
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-lifecycled/go.mod
          cache-dependency-path: tools/fased-lifecycled/go.sum

      - name: Download exact prior-run candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-hosting-candidate
          path: ${{ runner.temp }}/fased-hosting-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify source run, descriptor digest, and fixture-only correction
        id: identity
        env:
          CANDIDATE_DESCRIPTOR_SHA256: ${{ inputs.candidate_descriptor_sha256 }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_DESCRIPTOR_SHA256" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MANAGED_PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          descriptor="$RUNNER_TEMP/fased-hosting-candidate/fased-hosting-candidate.json"
          test "sha256:$(sha256sum "$descriptor" | awk '{print $1}')" = "$CANDIDATE_DESCRIPTOR_SHA256"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg commit "$SOURCE_COMMIT" --arg branch "v$RELEASE_VERSION" \
            '.path == ".github/workflows/hosted-runtime-release.yml" and
             .event == "workflow_dispatch" and .head_sha == $commit and
             .head_branch == $branch and .status == "completed" and .conclusion == "failure"' \
            <<<"$run_json" >/dev/null
          jq -e --arg version "$RELEASE_VERSION" --arg commit "$SOURCE_COMMIT" \
            --arg runId "$SOURCE_RUN_ID" \
            '.version == $version and .commit == $commit and
             .sourceRef == ("refs/tags/v" + $version) and
             .workflowRunId == $runId' "$descriptor" >/dev/null
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$(jq -er .tree "$descriptor")"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          unexpected="$({
            git diff --name-only "$SOURCE_COMMIT..$GITHUB_SHA" | grep -Ev \
              '^(\.github/workflows/candidate-p1-replay\.yml|docs/maintainers/codex-skills/fased-release-manager/(SKILL\.md|references/release\.md)|scripts/test-lifecycle-(local|hosting)-acceptance\.sh|scripts/docker/(protected-local|hosting)-systemd/lifecycle-acceptance\.sh|scripts/(hosted-installer-artifact-layout|ci-workflow-contract)\.test\.ts|scripts/prepare-candidate-fixture-trust\.sh)$' || true
          })"
          test -z "$unexpected" || { printf 'Replay contains product changes:\n%s\n' "$unexpected" >&2; exit 1; }
          GH_PROMPT_DISABLED=1 gh attestation verify "$descriptor" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$descriptor.attestation.json" \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "refs/tags/v$RELEASE_VERSION" \
            --deny-self-hosted-runners >/dev/null
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$PREDECESSOR_VERSION")"
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$MANAGED_PREDECESSOR_VERSION")"
          local_predecessors="$(jq -cn --arg stable "$PREDECESSOR_VERSION" --arg managed "$MANAGED_PREDECESSOR_VERSION" \
            '[{version:$stable,installationClass:"public-stable"},
              {version:$managed,installationClass:"canonical-managed"}] | unique_by([.version,.installationClass])')"
          hosting_predecessors="$(jq -cn --arg stable "$PREDECESSOR_VERSION" '[$stable]')"
          printf 'local_predecessors=%s\n' "$local_predecessors" >>"$GITHUB_OUTPUT"
          printf 'hosting_predecessors=%s\n' "$hosting_predecessors" >>"$GITHUB_OUTPUT"

      - name: Create non-publishable exact-inventory trust overlay
        run: >-
          bash scripts/prepare-candidate-fixture-trust.sh
          "$RUNNER_TEMP/fased-hosting-candidate"
          "$RUNNER_TEMP/fased-p1-replay-candidate"

      - name: Upload digest-bound replay candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-p1-replay-candidate
          path: ${{ runner.temp }}/fased-p1-replay-candidate/
          if-no-files-found: error
          retention-days: 7

  local-fresh:
    name: Replay fresh Local P1
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-p1-replay-candidate
          path: ${{ runner.temp }}/fased-p1-replay-candidate
      - name: Replay fresh Local
        env:
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/fased-p1-replay-candidate
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_SCENARIOS: fresh-install
          FASED_SYSTEMD_FIXTURE_PUBLIC_ACQUISITION: "1"
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "1"
          FASED_SYSTEMD_FIXTURE_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: bash scripts/test-lifecycle-local-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-p1-replay-local-fresh-receipts
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error

  local-update:
    name: Replay Local update P1 (${{ matrix.predecessor.version }}, ${{ matrix.predecessor.installationClass }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        predecessor: ${{ fromJSON(needs.verify.outputs.local_predecessors) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-p1-replay-candidate
          path: ${{ runner.temp }}/fased-p1-replay-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-predecessor-capsules-${{ matrix.predecessor.version }}-${{ matrix.predecessor.installationClass }}
          path: ${{ runner.temp }}/fased-predecessor
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Derive predecessor scenario
        id: scenario
        env:
          PREDECESSOR_VERSION: ${{ matrix.predecessor.version }}
        run: printf 'value=%s\n' "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$PREDECESSOR_VERSION")" >>"$GITHUB_OUTPUT"
      - name: Replay Local update
        env:
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/fased-p1-replay-candidate
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_SCENARIOS: ${{ steps.scenario.outputs.value }}
          FASED_SYSTEMD_FIXTURE_MANAGED_PREDECESSOR_VERSION: ${{ matrix.predecessor.version }}
          FASED_SYSTEMD_FIXTURE_MANAGED_PREDECESSOR_CLASS: ${{ matrix.predecessor.installationClass }}
          FASED_SYSTEMD_FIXTURE_PREDECESSOR_CAPSULE_DIR: ${{ runner.temp }}/fased-predecessor/protected-local
          FASED_SYSTEMD_FIXTURE_PUBLIC_ACQUISITION: "1"
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "1"
          FASED_SYSTEMD_FIXTURE_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: bash scripts/test-lifecycle-local-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-p1-replay-local-update-${{ matrix.predecessor.version }}-${{ matrix.predecessor.installationClass }}-receipts
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error

  hosting:
    name: Replay Hosting P1 (${{ matrix.predecessor }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        predecessor: ${{ fromJSON(needs.verify.outputs.hosting_predecessors) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-p1-replay-candidate
          path: ${{ runner.temp }}/fased-p1-replay-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-predecessor-capsules-${{ matrix.predecessor }}-public-stable
          path: ${{ runner.temp }}/fased-predecessor
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Replay Hosting install and update
        env:
          FASED_HOSTING_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/fased-p1-replay-candidate
          FASED_HOSTING_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_HOSTING_SYSTEMD_FIXTURE_SCENARIOS: fresh-install,managed-update
          FASED_HOSTING_SYSTEMD_FIXTURE_PREDECESSOR_VERSION: ${{ matrix.predecessor }}
          FASED_HOSTING_SYSTEMD_FIXTURE_PREDECESSOR_CAPSULE_DIR: ${{ runner.temp }}/fased-predecessor/hosting
          FASED_HOSTING_SYSTEMD_FIXTURE_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: bash scripts/test-lifecycle-hosting-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-p1-replay-hosting-${{ matrix.predecessor }}-receipts
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
