name: Verify Release Gate Receipt

on:
  workflow_call:
    inputs:
      run_id:
        description: Workflow run containing the immutable gate receipt
        required: true
        type: string
      artifact_name:
        description: Exact gate receipt artifact name
        required: true
        type: string
      receipt_phase:
        description: Exact release gate phase
        required: true
        type: string
      source_commit:
        description: Exact product source commit bound by the receipt
        required: true
        type: string
      release_version:
        description: Exact version-neutral release identity
        required: true
        type: string
      candidate_descriptor_digest:
        description: Optional exact candidate descriptor digest
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify immutable release gate receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout gate verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Download exact gate receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/release-gate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Verify canonical source and receipt identity
        env:
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.candidate_descriptor_digest }}
          RECEIPT_PHASE: ${{ inputs.receipt_phase }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            verify
            --receipt "$RUNNER_TEMP/release-gate/evidence.json"
            --phase "$RECEIPT_PHASE"
            --source-commit "$SOURCE_COMMIT"
            --source-tree "$(git rev-parse "$SOURCE_COMMIT^{tree}")"
            --lockfile-digest \
              "sha256:$(git show "$SOURCE_COMMIT:pnpm-lock.yaml" | sha256sum | awk '{print $1}')"
            --release-version "$RELEASE_VERSION"
          )
          if [[ -n "$CANDIDATE_DESCRIPTOR_DIGEST" ]]; then
            args+=(--candidate-descriptor-digest "$CANDIDATE_DESCRIPTOR_DIGEST")
          fi
          node scripts/release-gate.mjs "${args[@]}" >/dev/null
