name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      changed_test_paths_json: ${{ steps.scope.outputs.changed_test_paths_json }}
      lanes_json: ${{ steps.scope.outputs.lanes_json }}
      changed_ui_browser_tests: ${{ steps.scope.outputs.changed_ui_browser_tests }}
      test_only: ${{ steps.scope.outputs.test_only }}
      manual_review_required: ${{ steps.scope.outputs.manual_review_required }}
      docs_changed: ${{ steps.scope.outputs.docs_changed }}
      version_only: ${{ steps.scope.outputs.version_only }}
      dependency_remediation: ${{ steps.scope.outputs.dependency_remediation }}
      dependency_names_json: ${{ steps.scope.outputs.dependency_names_json }}
      run_dependency_integrity: ${{ steps.scope.outputs.run_dependency_integrity }}
      run_ci_contracts: ${{ steps.scope.outputs.run_ci_contracts }}
      run_node_focused: ${{ steps.scope.outputs.run_node_focused }}
      run_installer_release_verification: ${{ steps.scope.outputs.run_installer_release_verification }}
      run_node_unit: ${{ steps.scope.outputs.run_node_unit }}
      run_node_gateway: ${{ steps.scope.outputs.run_node_gateway }}
      run_node_extensions: ${{ steps.scope.outputs.run_node_extensions }}
      run_native_signer: ${{ steps.scope.outputs.run_native_signer }}
      run_signer_integration: ${{ steps.scope.outputs.run_signer_integration }}
      run_ui: ${{ steps.scope.outputs.run_ui }}
      run_ui_mining: ${{ steps.scope.outputs.run_ui_mining }}
      run_skills: ${{ steps.scope.outputs.run_skills }}
    steps:
      - name: Checkout proposed tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout protected-base classifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-authority
          fetch-depth: 1
          submodules: false

      - name: Classify changed surface
        id: scope
        env:
          FULL_MATRIX: "false"
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .ci-authority/scripts/ci-change-scope.mjs

  selected-tests:
    name: selected-tests
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject an unclassified change
        if: needs.classify.outputs.manual_review_required == 'true'
        run: |
          echo "The protected-base classifier has no automatic route for this change." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        if: needs.classify.outputs.version_only != 'true'
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Node.js for exact version-only validation
        if: needs.classify.outputs.version_only == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Setup Go when selected
        if: needs.classify.outputs.run_native_signer == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: |
            tools/fased-signerd/go.sum
            tools/fased-lifecycled/go.mod

      - name: Prove exact dependency remediation
        if: needs.classify.outputs.dependency_remediation == 'true'
        env:
          DEPENDENCY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-dependency-integrity.mjs

      - name: Audit complete dependency graph
        if: needs.classify.outputs.dependency_remediation == 'true'
        run: pnpm audit --audit-level low

      - name: Verify frozen lockfile integrity
        if: needs.classify.outputs.dependency_remediation == 'true'
        run: pnpm install --lockfile-only --ignore-scripts --frozen-lockfile --prefer-offline

      - name: Verify affected dependency paths and tests
        if: needs.classify.outputs.dependency_remediation == 'true'
        env:
          DEPENDENCY_NAMES_JSON: ${{ needs.classify.outputs.dependency_names_json }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dependencies < <(jq -er '.[]' <<<"$DEPENDENCY_NAMES_JSON")
          test "${#dependencies[@]}" -gt 0
          tests=()
          ui_sanitizer=false
          for dependency in "${dependencies[@]}"; do
            [[ "$dependency" =~ ^[A-Za-z0-9@._/-]+$ ]]
            pnpm why "$dependency" -r
            case "$dependency" in
              nanoid)
                tests+=(
                  extensions/matrix/src/matrix/client.test.ts
                  extensions/matrix/src/matrix/format.test.ts
                )
                ;;
              tar)
                tests+=(src/infra/archive.test.ts src/infra/update-runner.test.ts)
                ;;
              undici)
                tests+=(
                  src/infra/net/fetch-guard.dispatcher-cleanup.test.ts
                  src/telegram/fetch.test.ts
                )
                ;;
              sanitize-html)
                tests+=(src/agents/tools/web-fetch-visibility.test.ts)
                ;;
              hono)
                tests+=(src/agents/mcp-transport-config.test.ts src/agents/pi-bundle-mcp-runtime.test.ts)
                ;;
              dompurify)
                ui_sanitizer=true
                ;;
              postcss)
                # The production UI build below is the executable compatibility check.
                ;;
              *)
                echo "No focused affected-test mapping for $dependency" >&2
                exit 1
                ;;
            esac
          done
          if ((${#tests[@]} > 0)); then
            mapfile -t tests < <(printf '%s\n' "${tests[@]}" | sort -u)
            pnpm exec vitest run "${tests[@]}" --pool=forks --maxWorkers=1
          fi
          if [[ "$ui_sanitizer" == "true" ]]; then
            pnpm --dir ui exec node --input-type=module -e \
              "import createDOMPurify from 'dompurify'; if (typeof createDOMPurify !== 'function') process.exit(1)"
          fi

      - name: Validate exact version-only diff
        if: needs.classify.outputs.version_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-version-identity.mjs --allow-obsolete-tagged-candidate-restore

      - name: Check CI routing contracts
        if: needs.classify.outputs.run_ci_contracts == 'true'
        run: >-
          pnpm exec vitest run
          scripts/lifecycle-compatibility-inventory.test.ts
          scripts/ci-change-scope.test.ts
          scripts/ci-run-changed-tests.test.ts
          scripts/ci-required-gates.test.ts
          scripts/ci-merged-main-reuse.test.ts
          scripts/ci-version-identity.test.ts
          scripts/ci-workflow-contract.test.ts
          scripts/ci-compact-workflow.test.ts
          scripts/lifecycle-version-neutral.test.ts

      - name: Run focused Local-update regressions
        if: needs.classify.outputs.run_node_focused == 'true'
        run: >-
          pnpm exec vitest run
          scripts/go-lifecycle-routing.test.ts
          scripts/generation-updater.test.ts
          scripts/fased-managed-updater-fixed-client.test.ts
          scripts/managed-updater-bundle.test.ts
          src/wallet/wallet-application-state-permissions.test.ts
          --pool=forks
          --maxWorkers=1

      - name: Verify release-attestation path
        if: needs.classify.outputs.run_installer_release_verification == 'true'
        run: |
          bash -n install.sh
          pnpm exec vitest run \
            scripts/hosted-installer-artifact-layout.test.ts \
            scripts/hosted-security-boundary.test.ts \
            scripts/install-release-pin.test.ts \
            scripts/lifecycle-trust-policy.test.ts \
            scripts/go-lifecycle-routing.test.ts \
            scripts/managed-updater-bundle.test.ts \
            scripts/release-artifact-set.test.ts

      - name: Run selected unit tests
        if: needs.classify.outputs.run_node_unit == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.classify.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs unit

      - name: Run selected Gateway tests
        if: needs.classify.outputs.run_node_gateway == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.classify.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs gateway

      - name: Run selected extension tests
        if: needs.classify.outputs.run_node_extensions == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.classify.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs extensions

      - name: Test native signer on Linux
        if: needs.classify.outputs.run_native_signer == 'true'
        run: |
          (cd tools/fased-signerd && go test ./...)
          (cd tools/fased-lifecycled && go test ./...)
          bash scripts/test-build-lifecycle-generation.sh

      - name: Test signer integration
        if: needs.classify.outputs.run_signer_integration == 'true'
        run: >-
          pnpm vitest run
          scripts/go-lifecycle-routing.test.ts
          src/wallet/providers/local-socket-signer-adapter.integration.test.ts
          src/wizard/onboarding.wallet.test.ts
          --pool=forks
          --maxWorkers=1

      - name: Install Chromium for selected UI browser tests
        if: needs.classify.outputs.run_ui_mining == 'true' || (needs.classify.outputs.run_ui == 'true' && needs.classify.outputs.changed_ui_browser_tests == 'true')
        run: pnpm --dir ui exec playwright install chromium

      - name: Run selected Control UI tests
        if: needs.classify.outputs.run_ui == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.classify.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs ui

      - name: Run Mining UI tests
        if: needs.classify.outputs.run_ui_mining == 'true'
        run: pnpm test:ui:mining

      - name: Setup Python for skill tests
        if: needs.classify.outputs.run_skills == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run selected skill tests
        if: needs.classify.outputs.run_skills == 'true'
        run: |
          python -m pip install pytest ruff pyyaml
          python -m ruff check skills
          python -m pytest -q skills

      - name: Check documentation
        if: needs.classify.outputs.docs_changed == 'true' && needs.classify.outputs.version_only != 'true'
        run: pnpm check:docs

      - name: Check changed source formatting and lint
        if: needs.classify.outputs.version_only != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t format_files < <(git diff --name-only "$BASE" HEAD | grep -E '\.(cjs|css|html|js|json|json5|jsx|md|mdx|mjs|scss|ts|tsx|yaml|yml)$' || true)
          if [ "${#format_files[@]}" -gt 0 ]; then pnpm exec oxfmt --check "${format_files[@]}"; fi
          mapfile -t lint_files < <(git diff --name-only "$BASE" HEAD | grep -E '\.(cjs|js|jsx|mjs|ts|tsx)$' || true)
          if [ "${#lint_files[@]}" -gt 0 ]; then pnpm exec oxlint "${lint_files[@]}"; fi

  security:
    name: security
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Detect secrets and private keys
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pre-commit run detect-secrets --from-ref "$BASE" --to-ref HEAD
          pre-commit run detect-private-key --from-ref "$BASE" --to-ref HEAD

      - name: Audit changed workflows
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only "$BASE" HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -gt 0 ]; then pre-commit run zizmor --files "${files[@]}"; fi

  checks:
    name: checks
    if: always()
    needs: [classify, selected-tests, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require the compact PR gates
        env:
          CLASSIFY: ${{ needs.classify.result }}
          SELECTED: ${{ needs.selected-tests.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          test "$CLASSIFY" = success
          test "$SELECTED" = success
          test "$SECURITY" = success
