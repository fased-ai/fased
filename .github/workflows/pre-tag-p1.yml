name: Pre-tag P1

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact version-only protected-main commit to prove before tagging
        required: true
        type: string
      release_version:
        description: Unused candidate version encoded by the source commit
        required: true
        type: string
      predecessor_version:
        description: Latest supported public stable predecessor
        required: true
        type: string
      managed_predecessor_version:
        description: Representative supported pre-bootstrap managed predecessor
        required: true
        type: string
      pre_candidate_run_id:
        description: Successful pre-candidate run bound to the unversioned parent
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pre-tag-p1-${{ inputs.source_commit }}-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Verify protected pre-tag identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      local_predecessors: ${{ steps.identity.outputs.local_predecessors }}
      hosting_predecessors: ${{ steps.identity.outputs.hosting_predecessors }}
      release_sequence: ${{ steps.identity.outputs.release_sequence }}
      security_epoch: ${{ steps.identity.outputs.security_epoch }}
      local0_receipt_sha256: ${{ steps.identity.outputs.local0_receipt_sha256 }}
      hosting_staging_receipt_sha256: ${{ steps.identity.outputs.hosting_staging_receipt_sha256 }}
    steps:
      - name: Checkout exact version-only source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false

      - name: Verify version, protected main, and pre-candidate evidence
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PRE_CANDIDATE_RUN_ID: ${{ inputs.pre_candidate_run_id }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PRE_CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          [[ "$PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MANAGED_PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_COMMIT"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$RELEASE_VERSION" != "$PREDECESSOR_VERSION"
          test "$RELEASE_VERSION" != "$MANAGED_PREDECESSOR_VERSION"
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1
          ! gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1

          base_commit="$(git rev-parse "$SOURCE_COMMIT^")"
          GITHUB_EVENT_NAME=pull_request GITHUB_BASE_REF= GITHUB_BASE_SHA="$base_commit" \
            node scripts/ci-version-identity.mjs

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRE_CANDIDATE_RUN_ID")"
          jq -e --arg baseCommit "$base_commit" \
            '.name == "Pre-candidate" and .path == ".github/workflows/pre-candidate.yml" and
             .event == "workflow_dispatch" and .conclusion == "success" and .head_sha == $baseCommit' \
            <<<"$run_json" >/dev/null
          evidence_dir="$RUNNER_TEMP/pre-candidate-evidence"
          gh run download "$PRE_CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name fased-pre-candidate-evidence --dir "$evidence_dir"
          evidence="$evidence_dir/evidence.json"
          node scripts/release-gate.mjs verify \
            --receipt "$evidence" \
            --phase pre-candidate \
            --source-commit "$base_commit" \
            --source-tree "$(git rev-parse "$base_commit^{tree}")" \
            --lockfile-digest \
              "sha256:$(git show "$base_commit:pnpm-lock.yaml" | sha256sum | awk '{print $1}')" \
            --release-version "$RELEASE_VERSION" \
            --claim "predecessorVersion=$PREDECESSOR_VERSION" \
            --claim "managedPredecessorVersion=$MANAGED_PREDECESSOR_VERSION" \
            --claim "workflowRunId=$PRE_CANDIDATE_RUN_ID" >/dev/null

          main_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?head_sha=$SOURCE_COMMIT&branch=main&event=push&status=success&per_page=20")"
          jq -e --arg sourceCommit "$SOURCE_COMMIT" \
            '[.workflow_runs[] | select(.head_sha == $sourceCommit and .head_branch == "main" and
              .event == "push" and .conclusion == "success")] | length > 0' \
            <<<"$main_runs" >/dev/null
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$PREDECESSOR_VERSION")"
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$MANAGED_PREDECESSOR_VERSION")"
          node scripts/verify-lifecycle-root-pin.mjs
          # The pre-bootstrap managed topology enters through the verified
          # installer takeover, so its product transaction runs before a tag.
          # Post-tag P1 repeats it only to add authentic public acquisition.
          local_predecessors="$(jq -cn \
            --arg stable "$PREDECESSOR_VERSION" \
            --arg managed "$MANAGED_PREDECESSOR_VERSION" \
            '[{version:$stable,installationClass:"public-stable"},
              {version:$managed,installationClass:"canonical-managed"}] |
             unique_by([.version,.installationClass])')"
          hosting_predecessors="$(jq -cn --arg stable "$PREDECESSOR_VERSION" '[$stable]')"
          printf 'local_predecessors=%s\n' "$local_predecessors" >>"$GITHUB_OUTPUT"
          printf 'hosting_predecessors=%s\n' "$hosting_predecessors" >>"$GITHUB_OUTPUT"
          printf 'release_sequence=%s\n' "$(jq -er .claims.releaseSequence "$evidence")" >>"$GITHUB_OUTPUT"
          printf 'security_epoch=%s\n' "$(jq -er .claims.securityEpoch "$evidence")" >>"$GITHUB_OUTPUT"
          printf 'local0_receipt_sha256=%s\n' \
            "$(jq -er .claims.local0ReceiptDigest "$evidence")" >>"$GITHUB_OUTPUT"
          printf 'hosting_staging_receipt_sha256=%s\n' \
            "$(jq -er .claims.hostingStagingReceiptDigest "$evidence")" >>"$GITHUB_OUTPUT"

  candidate:
    name: Build one unpublished Linux-x64 candidate-shaped artifact
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      descriptor_sha256: ${{ steps.identity.outputs.descriptor_sha256 }}
      artifact_set_digest: ${{ steps.identity.outputs.artifact_set_digest }}
    steps:
      - name: Checkout exact version-only source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-lifecycled/go.mod
          cache-dependency-path: |
            tools/fased-lifecycled/go.sum
            tools/fased-signerd/go.sum

      - name: Build exact non-publishable x64 artifact once
        env:
          FASED_LIFECYCLE_RELEASE_SEQUENCE: ${{ needs.preflight.outputs.release_sequence }}
          FASED_LIFECYCLE_SECURITY_EPOCH: ${{ needs.preflight.outputs.security_epoch }}
          FASED_SYSTEMD_FIXTURE_BUILD_ONLY: "1"
          FASED_SYSTEMD_FIXTURE_OUTPUT_DIR: ${{ runner.temp }}/fased-pre-tag-candidate-raw
        run: bash scripts/test-lifecycle-local-acceptance.sh

      - name: Bind non-publishable fixture trust to the exact inventory
        env:
          FASED_LIFECYCLE_RELEASE_SEQUENCE: ${{ needs.preflight.outputs.release_sequence }}
          FASED_LIFECYCLE_SECURITY_EPOCH: ${{ needs.preflight.outputs.security_epoch }}
        run: >-
          bash scripts/prepare-candidate-fixture-trust.sh
          "$RUNNER_TEMP/fased-pre-tag-candidate-raw"
          "$RUNNER_TEMP/fased-pre-tag-candidate"

      - name: Verify candidate-shaped inventory
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/fased-pre-tag-candidate"
          descriptor="$candidate/fased-hosting-candidate.json"
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$SOURCE_COMMIT" \
            --arg tree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --arg lockfileDigest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            '.version == $version and .commit == $commit and .tree == $tree and
             .lockfileDigest == $lockfileDigest and .sourceRef == ("refs/tags/v" + $version)' \
            "$descriptor" >/dev/null
          jq -e '.profile == "branch-x64" and .publishable == false' \
            "$candidate/fased-branch-proof-x64.json" >/dev/null
          digest="sha256:$(sha256sum "$descriptor" | awk '{print $1}')"
          printf 'descriptor_sha256=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          printf 'artifact_set_digest=%s\n' \
            "$(jq -er '.artifactSetDigest | select(test("^sha256:[a-f0-9]{64}$"))' "$descriptor")" \
            >>"$GITHUB_OUTPUT"

      - name: Prove nonpublishing finalization before immutable tag
        env:
          RELEASE_SEQUENCE: ${{ needs.preflight.outputs.release_sequence }}
          SECURITY_EPOCH: ${{ needs.preflight.outputs.security_epoch }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/finalize-pretag-candidate.sh \
            "$RUNNER_TEMP/fased-pre-tag-candidate" \
            "$RUNNER_TEMP/fased-pre-tag-finalized" \
            "$RELEASE_VERSION" \
            "$SOURCE_COMMIT" \
            "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            "$RELEASE_SEQUENCE" \
            "$SECURITY_EPOCH"
          test -s "$RUNNER_TEMP/fased-pre-tag-finalized/fased-hosted-release-v2.json"
          test -s \
            "$RUNNER_TEMP/fased-pre-tag-finalized/fased-lifecycle-release-compatibility-v1.json"
          test ! -e "$RUNNER_TEMP/fased-pre-tag-finalized/fased-candidate-fixture-overlay.json"

      - name: Upload exact pre-tag candidate-shaped artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-pre-tag-candidate
          path: ${{ runner.temp }}/fased-pre-tag-candidate/*
          if-no-files-found: error
          retention-days: 30

  local-fresh:
    name: Pre-tag fresh Local P1
    needs: [preflight, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - name: Download exact pre-tag artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-pre-tag-candidate
          path: ${{ runner.temp }}/fased-pre-tag-candidate
      - name: Restore cached Local fixture image
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-ubuntu-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}
      - name: Run exact fresh Local entrypoint
        env:
          GH_TOKEN: ${{ github.token }}
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/fased-pre-tag-candidate
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "1"
          FASED_SYSTEMD_FIXTURE_PUBLIC_ACQUISITION: "1"
          FASED_SYSTEMD_FIXTURE_RECEIPT_DIR: ${{ runner.temp }}/receipts
          FASED_SYSTEMD_FIXTURE_SCENARIOS: fresh-install
        run: bash scripts/test-lifecycle-local-acceptance.sh
      - name: Upload fresh Local receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-pre-tag-local-fresh-receipt
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
          retention-days: 30

  local-update:
    name: Pre-tag Local update P1 (${{ matrix.predecessor.version }}, ${{ matrix.predecessor.installationClass }})
    needs: [preflight, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        predecessor: ${{ fromJSON(needs.preflight.outputs.local_predecessors) }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - name: Download exact pre-tag artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-pre-tag-candidate
          path: ${{ runner.temp }}/fased-pre-tag-candidate
      - name: Restore cached Local fixture image
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-ubuntu-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}
      - name: Derive exact predecessor topology
        id: scenario
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_VERSION: ${{ matrix.predecessor.version }}
        run: |
          scenarios="$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$PREDECESSOR_VERSION")"
          test -n "$scenarios"
          printf 'scenarios=%s\n' "$scenarios" >>"$GITHUB_OUTPUT"
      - name: Run exact Local update entrypoint
        env:
          GH_TOKEN: ${{ github.token }}
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/fased-pre-tag-candidate
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_MANAGED_PREDECESSOR_VERSION: ${{ matrix.predecessor.version }}
          FASED_SYSTEMD_FIXTURE_MANAGED_PREDECESSOR_CLASS: ${{ matrix.predecessor.installationClass }}
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "1"
          FASED_SYSTEMD_FIXTURE_PUBLIC_ACQUISITION: "1"
          FASED_SYSTEMD_FIXTURE_RECEIPT_DIR: ${{ runner.temp }}/receipts
          FASED_SYSTEMD_FIXTURE_SCENARIOS: ${{ steps.scenario.outputs.scenarios }}
        run: bash scripts/test-lifecycle-local-acceptance.sh
      - name: Upload Local update receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-pre-tag-local-update-${{ matrix.predecessor.version }}-${{ matrix.predecessor.installationClass }}-receipt
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
          retention-days: 30

  hosting:
    name: Pre-tag Hosting P1 (${{ matrix.predecessor }})
    needs: [preflight, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        predecessor: ${{ fromJSON(needs.preflight.outputs.hosting_predecessors) }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - name: Download exact pre-tag artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-pre-tag-candidate
          path: ${{ runner.temp }}/fased-pre-tag-candidate
      - name: Run exact Hosting entrypoint
        env:
          GH_TOKEN: ${{ github.token }}
          FASED_HOSTING_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/fased-pre-tag-candidate
          FASED_HOSTING_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_HOSTING_SYSTEMD_FIXTURE_PREDECESSOR_VERSION: ${{ matrix.predecessor }}
          FASED_HOSTING_SYSTEMD_FIXTURE_RECEIPT_DIR: ${{ runner.temp }}/receipts
          FASED_HOSTING_SYSTEMD_FIXTURE_SCENARIOS: fresh-install,managed-update
        run: bash scripts/test-lifecycle-hosting-acceptance.sh
      - name: Upload Hosting receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-pre-tag-hosting-${{ matrix.predecessor }}-receipts
          path: ${{ runner.temp }}/receipts/*.json
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: Record protected pre-tag P1 evidence
    needs: [preflight, candidate, local-fresh, local-update, hosting]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false
      - name: Download exact pre-candidate gate receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-pre-candidate-evidence
          path: ${{ runner.temp }}/pre-candidate-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pre_candidate_run_id }}
      - name: Record immutable pre-tag evidence
        env:
          DESCRIPTOR_SHA256: ${{ needs.candidate.outputs.descriptor_sha256 }}
          ARTIFACT_SET_DIGEST: ${{ needs.candidate.outputs.artifact_set_digest }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PRE_CANDIDATE_RUN_ID: ${{ inputs.pre_candidate_run_id }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_SEQUENCE: ${{ needs.preflight.outputs.release_sequence }}
          SECURITY_EPOCH: ${{ needs.preflight.outputs.security_epoch }}
          LOCAL0_RECEIPT_SHA256: ${{ needs.preflight.outputs.local0_receipt_sha256 }}
          HOSTING_STAGING_RECEIPT_SHA256: ${{ needs.preflight.outputs.hosting_staging_receipt_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-tag-evidence"
          node scripts/release-gate.mjs record \
            --phase pre-tag-p1 \
            --source-commit "$SOURCE_COMMIT" \
            --source-tree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --lockfile-digest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --release-version "$RELEASE_VERSION" \
            --candidate-descriptor-digest "$DESCRIPTOR_SHA256" \
            --artifact-set-digest "$ARTIFACT_SET_DIGEST" \
            --upstream-receipt "$RUNNER_TEMP/pre-candidate-evidence/evidence.json" \
            --claim "predecessorVersion=$PREDECESSOR_VERSION" \
            --claim "managedPredecessorVersion=$MANAGED_PREDECESSOR_VERSION" \
            --claim "releaseSequence=$RELEASE_SEQUENCE" \
            --claim "securityEpoch=$SECURITY_EPOCH" \
            --claim "preCandidateRunId=$PRE_CANDIDATE_RUN_ID" \
            --claim "workflowRunId=$GITHUB_RUN_ID" \
            --claim "local0ReceiptDigest=$LOCAL0_RECEIPT_SHA256" \
            --claim "hostingStagingReceiptDigest=$HOSTING_STAGING_RECEIPT_SHA256" \
            --output "$RUNNER_TEMP/pre-tag-evidence/evidence.json"
      - name: Upload protected pre-tag evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-pre-tag-p1-evidence
          path: ${{ runner.temp }}/pre-tag-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30
