name: Hosted Runtime Release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact immutable tagged package version to build once and promote
        required: true
        type: string
      source_commit:
        description: Exact protected-main commit to build once
        required: true
        type: string
      predecessor_version:
        description: Exact supported public stable version used by packaged update P1
        required: true
        type: string
      managed_predecessor_version:
        description: Representative supported pre-bootstrap managed predecessor
        required: true
        type: string
      pre_candidate_run_id:
        description: Successful Pre-candidate workflow run bound to the unversioned parent source
        required: true
        type: string
      pre_tag_p1_run_id:
        description: Successful protected pre-tag P1 run bound to the exact versioned source
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && format('fased-root-head-refresh-{0}', github.run_id) || format('fased-lifecycle-channel-{0}', contains(inputs.release_version, '-') && 'beta' || 'stable') }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Validate release preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      p1_local_predecessors: ${{ steps.p1-plan.outputs.local_predecessors }}
      p1_hosting_predecessors: ${{ steps.p1-plan.outputs.hosting_predecessors }}
      release_sequence: ${{ steps.pre-candidate.outputs.release_sequence }}
      security_epoch: ${{ steps.pre-candidate.outputs.security_epoch }}
      pretag_descriptor_sha256: ${{ steps.pretag.outputs.descriptor_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          # Release validation exercises one frozen pre-generation updater
          # fixture stored at an immutable historical tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Verify exact immutable tagged candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$GITHUB_REF" = "refs/tags/v$RELEASE_VERSION"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          [[ "$PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MANAGED_PREDECESSOR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test "$PREDECESSOR_VERSION" != "$RELEASE_VERSION"
          test "$MANAGED_PREDECESSOR_VERSION" != "$RELEASE_VERSION"
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$remote_main" = "$SOURCE_COMMIT"
          remote_tag="$(git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" | awk '{print $1}')"
          test "$remote_tag" = "$SOURCE_COMMIT"
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Candidate release already exists: v$RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Verify immutable pre-candidate pass
        id: pre-candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PRE_CANDIDATE_RUN_ID: ${{ inputs.pre_candidate_run_id }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRE_CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          base_commit="$(git rev-parse "$SOURCE_COMMIT^")"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRE_CANDIDATE_RUN_ID")"
          jq -e \
            --arg baseCommit "$base_commit" \
            '.name == "Pre-candidate" and .path == ".github/workflows/pre-candidate.yml" and .event == "workflow_dispatch" and .conclusion == "success" and .head_sha == $baseCommit' \
            <<<"$run_json" >/dev/null
          GITHUB_EVENT_NAME=pull_request \
            GITHUB_BASE_REF= \
            GITHUB_BASE_SHA="$base_commit" \
            node scripts/ci-version-identity.mjs --allow-exact-tag
          evidence_dir="$RUNNER_TEMP/pre-candidate-evidence"
          gh run download "$PRE_CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name fased-pre-candidate-evidence \
            --dir "$evidence_dir"
          evidence="$evidence_dir/evidence.json"
          test -f "$evidence"
          jq -e \
            --arg sourceCommit "$base_commit" \
            --arg sourceTree "$(git rev-parse "$base_commit^{tree}")" \
            --arg lockfileDigest "sha256:$(git show "$base_commit:pnpm-lock.yaml" | sha256sum | awk '{print $1}')" \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg managedPredecessorVersion "$MANAGED_PREDECESSOR_VERSION" \
            --arg predecessorVersion "$PREDECESSOR_VERSION" \
            --arg workflowRunId "$PRE_CANDIDATE_RUN_ID" \
            '.schemaVersion == 4 and .sourceCommit == $sourceCommit and .sourceTree == $sourceTree and .lockfileDigest == $lockfileDigest and .nextReleaseVersion == $releaseVersion and .predecessorVersion == $predecessorVersion and .managedPredecessorVersion == $managedPredecessorVersion and (.releaseSequence | type == "number" and . >= 1) and (.securityEpoch | type == "number" and . >= 1) and (.local0ReceiptSha256 | test("^sha256:[a-f0-9]{64}$")) and .workflowRunId == $workflowRunId' \
            "$evidence" >/dev/null
          printf 'release_sequence=%s\n' "$(jq -er .releaseSequence "$evidence")" >>"$GITHUB_OUTPUT"
          printf 'security_epoch=%s\n' "$(jq -er .securityEpoch "$evidence")" >>"$GITHUB_OUTPUT"
          main_run_id="$(jq -er '.mainRunId | select(test("^[0-9]+$"))' "$evidence")"
          main_checks_job_id="$(
            jq -er '.mainChecksJobId | select(test("^[0-9]+$"))' "$evidence"
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$main_run_id" \
            | jq -e \
              --arg sourceCommit "$base_commit" \
              '.path == ".github/workflows/main.yml" and .head_sha == $sourceCommit and .head_branch == "main" and .event == "push" and .conclusion == "success"' \
              >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$main_checks_job_id" \
            | jq -e \
              --argjson runId "$main_run_id" \
              '.run_id == $runId and .name == "checks" and .conclusion == "success"' \
              >/dev/null

      - name: Verify immutable protected pre-tag P1 pass
        id: pretag
        env:
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PRE_CANDIDATE_RUN_ID: ${{ inputs.pre_candidate_run_id }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
          PRE_TAG_P1_RUN_ID: ${{ inputs.pre_tag_p1_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_SEQUENCE: ${{ steps.pre-candidate.outputs.release_sequence }}
          SECURITY_EPOCH: ${{ steps.pre-candidate.outputs.security_epoch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRE_TAG_P1_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRE_TAG_P1_RUN_ID")"
          jq -e \
            --arg sourceCommit "$SOURCE_COMMIT" \
            '.name == "Pre-tag P1" and .path == ".github/workflows/pre-tag-p1.yml" and
             .event == "workflow_dispatch" and .conclusion == "success" and
             .head_sha == $sourceCommit' <<<"$run_json" >/dev/null
          evidence_dir="$RUNNER_TEMP/pre-tag-p1-evidence"
          gh run download "$PRE_TAG_P1_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name fased-pre-tag-p1-evidence \
            --dir "$evidence_dir"
          evidence="$evidence_dir/evidence.json"
          jq -e \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg predecessorVersion "$PREDECESSOR_VERSION" \
            --arg managedPredecessorVersion "$MANAGED_PREDECESSOR_VERSION" \
            --arg preCandidateRunId "$PRE_CANDIDATE_RUN_ID" \
            --arg workflowRunId "$PRE_TAG_P1_RUN_ID" \
            --arg releaseSequence "$RELEASE_SEQUENCE" \
            --arg securityEpoch "$SECURITY_EPOCH" \
            '.schemaVersion == 4 and .sourceCommit == $sourceCommit and
             .sourceTree == $sourceTree and .releaseVersion == $releaseVersion and
             .predecessorVersion == $predecessorVersion and
             .managedPredecessorVersion == $managedPredecessorVersion and
             .managedPredecessorInstallationClass == "canonical-managed" and
             .managedTransitionStage == "pretag-installer-takeover" and
             .releaseSequence == ($releaseSequence | tonumber) and
             .securityEpoch == ($securityEpoch | tonumber) and
             .preCandidateRunId == $preCandidateRunId and
             .workflowRunId == $workflowRunId and
             (.local0ReceiptSha256 | test("^sha256:[a-f0-9]{64}$")) and
             (.candidateDescriptorSha256 | test("^sha256:[a-f0-9]{64}$"))' \
            "$evidence" >/dev/null
          printf 'descriptor_sha256=%s\n' \
            "$(jq -er .candidateDescriptorSha256 "$evidence")" >>"$GITHUB_OUTPUT"

      - name: Verify public compatibility coverage and derive P1 topology
        id: p1-plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANAGED_PREDECESSOR_VERSION: ${{ inputs.managed_predecessor_version }}
          PREDECESSOR_VERSION: ${{ inputs.predecessor_version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lifecycle-compatibility-inventory.mjs --verify-release "$PREDECESSOR_VERSION"
          node scripts/lifecycle-compatibility-inventory.mjs --verify-release "$MANAGED_PREDECESSOR_VERSION"
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$PREDECESSOR_VERSION")"
          test -n "$(node scripts/lifecycle-compatibility-inventory.mjs --p1-scenarios "$MANAGED_PREDECESSOR_VERSION")"
          gh release view "v$MANAGED_PREDECESSOR_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          local_predecessors="$(jq -cn --arg stable "$PREDECESSOR_VERSION" --arg managed "$MANAGED_PREDECESSOR_VERSION" \
            '[{version:$stable,installationClass:"public-stable"},
              {version:$managed,installationClass:"canonical-managed"}] | unique_by([.version,.installationClass])')"
          hosting_predecessors="$(jq -cn --arg stable "$PREDECESSOR_VERSION" '[$stable]')"
          printf 'local_predecessors=%s\n' "$local_predecessors" >>"$GITHUB_OUTPUT"
          printf 'hosting_predecessors=%s\n' "$hosting_predecessors" >>"$GITHUB_OUTPUT"

  finalize-candidate:
    name: Attest the exact pre-tag P1 product bytes
    needs: [preflight]
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-lifecycled/go.mod
          cache-dependency-path: tools/fased-lifecycled/go.sum

      - name: Download the exact pre-tag P1 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-pre-tag-candidate
          path: ${{ runner.temp }}/fased-pre-tag-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pre_tag_p1_run_id }}

      - name: Verify and stage only the pre-tag product bytes
        env:
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.preflight.outputs.pretag_descriptor_sha256 }}
          RELEASE_SEQUENCE: ${{ needs.preflight.outputs.release_sequence }}
          SECURITY_EPOCH: ${{ needs.preflight.outputs.security_epoch }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/fased-pre-tag-candidate"
          test "sha256:$(sha256sum "$source_dir/fased-hosting-candidate.json" | awk '{print $1}')" = \
            "$EXPECTED_DESCRIPTOR_SHA256"
          mkdir -m 0700 "$GITHUB_WORKSPACE/.artifacts"
          bash scripts/finalize-pretag-candidate.sh \
            "$source_dir" \
            "$GITHUB_WORKSPACE/.artifacts/hosted-runtime" \
            "$RELEASE_VERSION" \
            "$SOURCE_COMMIT" \
            "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            "$RELEASE_SEQUENCE" \
            "$SECURITY_EPOCH"

      - name: Attest native signer product bytes
        id: attest-native-signer
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-signerd-*

      - name: Stage native signer attestation
        run: >-
          install -m 0644 "${{ steps.attest-native-signer.outputs.bundle-path }}"
          .artifacts/hosted-runtime/fased-signerd-release.attestation.json

      - name: Attest native lifecycle product bytes
        id: attest-native-lifecycle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-lifecycled-*

      - name: Stage native lifecycle attestation
        run: >-
          install -m 0644 "${{ steps.attest-native-lifecycle.outputs.bundle-path }}"
          .artifacts/hosted-runtime/fased-lifecycled-release.attestation.json

      - name: Attest root Hosting bootstrap
        id: attest-hosting-bootstrap
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/install.sh

      - name: Stage root Hosting bootstrap attestation
        run: >-
          install -m 0644 "${{ steps.attest-hosting-bootstrap.outputs.bundle-path }}"
          .artifacts/hosted-runtime/install.sh.attestation.json

      - name: Attest unified candidate manifest
        id: attest-candidate-manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-hosted-release-v2.json

      - name: Stage candidate manifest attestation
        run: >-
          install -m 0644 "${{ steps.attest-candidate-manifest.outputs.bundle-path }}"
          .artifacts/hosted-runtime/fased-hosted-release-v2.json.attestation.json

      - name: Attest privileged release provenance
        id: attest-candidate-provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json

      - name: Stage privileged provenance attestation
        run: >-
          install -m 0644 "${{ steps.attest-candidate-provenance.outputs.bundle-path }}"
          .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json.attestation.json

      - name: Attest lifecycle trust metadata
        id: attest-candidate-lifecycle-trust
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json

      - name: Stage lifecycle trust attestation
        run: >-
          install -m 0644 "${{ steps.attest-candidate-lifecycle-trust.outputs.bundle-path }}"
          .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json.attestation.json

      - name: Attest production lifecycle release index
        id: attest-lifecycle-release-index
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-release-index-v1.json

      - name: Stage lifecycle release index attestation
        run: >-
          install -m 0644 "${{ steps.attest-lifecycle-release-index.outputs.bundle-path }}"
          .artifacts/hosted-runtime/fased-release-index-v1.json.attestation.json

      - name: Attest current lifecycle root head
        id: attest-lifecycle-root-head
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-lifecycle-root-head-v1.json

      - name: Stage lifecycle root-head attestation
        run: >-
          install -m 0644 "${{ steps.attest-lifecycle-root-head.outputs.bundle-path }}"
          .artifacts/hosted-runtime/fased-lifecycle-root-head-v1.json.attestation.json

      - name: Bind and verify the final candidate artifact set
        env:
          GH_PROMPT_DISABLED: "1"
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          directory=.artifacts/hosted-runtime
          source_ref="refs/tags/v$RELEASE_VERSION"
          verify() {
            gh attestation verify "$directory/$1" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$directory/$2" \
              --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
              --source-ref "$source_ref" \
              --source-digest "$SOURCE_COMMIT" \
              --deny-self-hosted-runners >/dev/null
          }
          verify fased-hosted-release-v2.json fased-hosted-release-v2.json.attestation.json
          verify fased-lifecycle-trust-v1.json fased-lifecycle-trust-v1.json.attestation.json
          verify fased-release-index-v1.json fased-release-index-v1.json.attestation.json
          verify fased-lifecycle-root-head-v1.json fased-lifecycle-root-head-v1.json.attestation.json
          verify fased-privileged-provenance-v1.intoto.json \
            fased-privileged-provenance-v1.intoto.json.attestation.json
          verify fased-signerd-linux-amd64 fased-signerd-release.attestation.json
          verify fased-lifecycled-linux-amd64 fased-lifecycled-release.attestation.json
          verify install.sh install.sh.attestation.json
          node scripts/release-artifact-set.mjs build \
            --directory "$directory" \
            --version "$RELEASE_VERSION" \
            --commit "$SOURCE_COMMIT" \
            --tree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --lockfile-digest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --source-ref "$source_ref" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Attest the final candidate descriptor
        id: attest-candidate-descriptor
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-hosting-candidate.json

      - name: Stage and verify the final candidate descriptor
        env:
          GH_PROMPT_DISABLED: "1"
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-candidate-descriptor.outputs.bundle-path }}" \
            .artifacts/hosted-runtime/fased-hosting-candidate.json.attestation.json
          gh attestation verify .artifacts/hosted-runtime/fased-hosting-candidate.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle .artifacts/hosted-runtime/fased-hosting-candidate.json.attestation.json \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "refs/tags/v$RELEASE_VERSION" \
            --source-digest "$SOURCE_COMMIT" \
            --deny-self-hosted-runners >/dev/null
          node scripts/release-artifact-set.mjs verify \
            --directory .artifacts/hosted-runtime \
            --version "$RELEASE_VERSION" \
            --commit "$SOURCE_COMMIT" \
            --tree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --lockfile-digest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --source-ref "refs/tags/v$RELEASE_VERSION" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload the exact finalized candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-hosting-candidate
          path: .artifacts/hosted-runtime/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Promote exact verified candidate bytes
    needs: [finalize-candidate]
    environment: candidate-release
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact P1-tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Reverify immutable candidate tag before publication
        env:
          RELEASE_TAG: v${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$remote_tag" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Download the complete P1-tested candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-hosting-candidate
          path: .artifacts/hosted-runtime

      - name: Verify exact candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_VERSION" = "$package_version"
          release_commit="$(git rev-parse HEAD)"
          test "$release_commit" = "$SOURCE_COMMIT"
          node scripts/release-artifact-set.mjs verify \
            --directory .artifacts/hosted-runtime \
            --version "$package_version" \
            --commit "$release_commit" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --lockfile-digest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID"
          gh attestation verify \
            .artifacts/hosted-runtime/fased-hosting-candidate.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle .artifacts/hosted-runtime/fased-hosting-candidate.json.attestation.json \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners >/dev/null
          gh attestation verify \
            .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle \
              .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json.attestation.json \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners >/dev/null
          node scripts/privileged-release-evidence.mjs verify \
            --release-manifest .artifacts/hosted-runtime/fased-hosted-release-v2.json \
            --lifecycle-metadata .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json \
            --provenance .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json \
            --sbom .artifacts/hosted-runtime/fased-privileged-sbom-v1.spdx.json \
            --vex .artifacts/hosted-runtime/fased-privileged-vex-v1.openvex.json \
            --version "$package_version" \
            --commit "$release_commit"

      - name: Publish one draft and expose it only after every byte uploads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          release_id=""
          find_draft_id() {
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --slurp | jq -er --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag and .draft == true)] |
                 if length == 1 then .[0].id else error("exact draft release not found") end'
          }
          cleanup_draft() {
            if [[ -z "$release_id" ]]; then
              release_id="$(find_draft_id 2>/dev/null || true)"
            fi
            if [[ -n "$release_id" ]]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_draft EXIT
          is_prerelease=false
          make_latest=true
          if [[ "$package_version" == *-* ]]; then
            is_prerelease=true
            make_latest=false
          fi
          existing_release_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')"
          if [[ -n "$existing_release_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$existing_release_id" \
              > "$RUNNER_TEMP/existing-release.json"
            jq -e \
              --arg tag "$RELEASE_TAG" \
              --argjson prerelease "$is_prerelease" \
              '.tag_name == $tag and .draft == false and .prerelease == $prerelease' \
              "$RUNNER_TEMP/existing-release.json" >/dev/null
            jq '[.assets[] | {name,size,digest}]' \
              "$RUNNER_TEMP/existing-release.json" > "$RUNNER_TEMP/release-assets.json"
            node scripts/release-artifact-set.mjs verify-assets \
              --directory .artifacts/hosted-runtime \
              --assets-json "$RUNNER_TEMP/release-assets.json"
            release_id=""
            trap - EXIT
            exit 0
          fi
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "Fased Agent $RELEASE_TAG"
            --generate-notes
            --verify-tag
            --draft
          )
          if [[ "$is_prerelease" == true ]]; then
            release_args+=(--prerelease)
          fi
          # Keep the release explicitly private until GitHub's remote asset metadata
          # matches the exact locally verified candidate set.
          gh release create "$RELEASE_TAG" .artifacts/hosted-runtime/* "${release_args[@]}"
          release_id="$(find_draft_id)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '[.assets[] | {name,size,digest}]' > "$RUNNER_TEMP/release-assets.json"
          node scripts/release-artifact-set.mjs verify-assets \
            --directory .artifacts/hosted-runtime \
            --assets-json "$RUNNER_TEMP/release-assets.json"
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$is_prerelease" \
            -f make_latest="$make_latest" \
            --jq '{tagName:.tag_name,draft,isPrerelease:.prerelease}' \
            > "$RUNNER_TEMP/published-release.json"
          test "$(jq -r .tagName "$RUNNER_TEMP/published-release.json")" = "$RELEASE_TAG"
          test "$(jq -r .draft "$RUNNER_TEMP/published-release.json")" = "false"
          test "$(jq -r .isPrerelease "$RUNNER_TEMP/published-release.json")" = "$is_prerelease"
          release_id=""
          trap - EXIT

      - name: Advance signed managed channel to the exact public candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: >-
          bash scripts/publish-lifecycle-channel.sh
          .artifacts/hosted-runtime
          "${SOURCE_COMMIT}"

  refresh-root-head:
    name: Refresh ${{ matrix.channel }} lifecycle root witness
    if: github.event_name == 'schedule'
    concurrency:
      group: fased-lifecycle-channel-${{ matrix.channel }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout protected main witness code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Prepare current channel root-head statement
        id: prepare
        env:
          CHANNEL: ${{ matrix.channel }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          channel_tag="fased-channel-$CHANNEL-v1"
          printf 'found=false\n' >>"$GITHUB_OUTPUT"
          if ! gh release view "$channel_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          directory="$RUNNER_TEMP/root-head-$CHANNEL"
          mkdir -p "$directory"
          gh release download "$channel_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'fased-lifecycle-root-v*.json' \
            --pattern 'fased-release-index-v1.json' \
            --pattern 'fased-release-index-v1.json.attestation.json' \
            --dir "$directory"
          source_roots="$RUNNER_TEMP/source-roots-$CHANNEL"
          mkdir -p "$source_roots"
          mapfile -t root_policies < <(find release/lifecycle-trust -mindepth 2 -maxdepth 2 \
            -type f -name 'fased-lifecycle-root-v*.json' | sort -V)
          test "${#root_policies[@]}" -gt 0
          for source_root in "${root_policies[@]}"; do
            root_name="$(basename "$source_root")"
            install -m 0644 "$source_root" "$source_roots/$root_name"
            cmp -s "$source_root" "$directory/$root_name"
          done
          test "$(find "$directory" -maxdepth 1 -type f -name 'fased-lifecycle-root-v*.json' | wc -l)" \
            -eq "${#root_policies[@]}"
          root_info="$(node scripts/verify-lifecycle-root-chain.mjs \
            --directory "$source_roots" \
            --pin release/lifecycle-trust/root-v1/fased-lifecycle-root-v1.sha256)"
          version="$(jq -er .version "$directory/fased-release-index-v1.json")"
          test "$(jq -er .channel "$directory/fased-release-index-v1.json")" = "$CHANNEL"
          gh attestation verify "$directory/fased-release-index-v1.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$directory/fased-release-index-v1.json.attestation.json" \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "refs/tags/v$version" \
            --deny-self-hosted-runners >/dev/null
          root_version="$(jq -er .version <<<"$root_info")"
          readarray -t root_head_times < <(node -e '
            const issued = new Date();
            const expires = new Date(issued.getTime() + 36 * 60 * 60 * 1000);
            process.stdout.write(`${issued.toISOString()}\n${expires.toISOString()}\n`);
          ')
          node scripts/build-lifecycle-root-head.mjs \
            --root "$source_roots/fased-lifecycle-root-v${root_version}.json" \
            --index "$directory/fased-release-index-v1.json" \
            --witness-ref refs/heads/main \
            --witness-commit "$GITHUB_SHA" \
            --issued-at "${root_head_times[0]}" \
            --expires-at "${root_head_times[1]}" \
            --output "$directory/fased-lifecycle-root-head-v1.json"
          printf 'directory=%s\n' "$directory" >>"$GITHUB_OUTPUT"
          printf 'found=true\n' >>"$GITHUB_OUTPUT"

      - name: Attest refreshed lifecycle root head
        if: steps.prepare.outputs.found == 'true'
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ steps.prepare.outputs.directory }}/fased-lifecycle-root-head-v1.json

      - name: Publish refreshed lifecycle root witness
        if: steps.prepare.outputs.found == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          GH_TOKEN: ${{ github.token }}
          ROOT_HEAD_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest.outputs.bundle-path }}" \
            "$ROOT_HEAD_DIRECTORY/fased-lifecycle-root-head-v1.json.attestation.json"
          bash scripts/publish-lifecycle-root-head.sh \
            "$ROOT_HEAD_DIRECTORY" \
            "fased-channel-$CHANNEL-v1"
