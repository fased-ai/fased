name: Hosted Runtime Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact version already committed on protected main
        required: true
        type: string
      source_commit:
        description: Exact protected-main commit to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-runtime-release-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Build and attest exact candidate once
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_sequence: ${{ steps.channel.outputs.release_sequence }}
      security_epoch: ${{ steps.channel.outputs.security_epoch }}
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: false

      - name: Verify exact source and version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "$RELEASE_VERSION" == *-* ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_COMMIT"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable release already exists; run Hosted Runtime Promote instead." >&2
            exit 1
          fi

      - name: Resolve exact next signed channel identity
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/channel.json"
          index="$RUNNER_TEMP/channel-index.json"
          attestation="$RUNNER_TEMP/channel-index.attestation.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/fased-channel-beta-v1" > "$release_json"
          download() {
            local name="$1" output="$2" id
            id="$(jq -er --arg name "$name" \
              '[.assets[] | select(.name == $name)] |
               if length == 1 then .[0].id else error("channel asset is not unique") end' \
              "$release_json")"
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$output"
          }
          download fased-release-index-v1.json "$index"
          download fased-release-index-v1.json.attestation.json "$attestation"
          identity="$(node scripts/release-attestation-identity.mjs resolve \
            --bundle "$attestation" --repository "$GITHUB_REPOSITORY")"
          GH_PROMPT_DISABLED=1 gh attestation verify "$index" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$attestation" \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "$(jq -er .sourceRef <<<"$identity")" \
            --source-digest "$(jq -er .sourceDigest <<<"$identity")" \
            --deny-self-hosted-runners >/dev/null
          release_sequence="$(jq -er '.releaseSequence + 1' "$index")"
          security_epoch="$(jq -er .securityEpoch "$index")"
          node scripts/verify-next-release-sequence.mjs \
            --current "$index" --release-sequence "$release_sequence" \
            --security-epoch "$security_epoch" >/dev/null
          printf 'release_sequence=%s\n' "$release_sequence" >> "$GITHUB_OUTPUT"
          printf 'security_epoch=%s\n' "$security_epoch" >> "$GITHUB_OUTPUT"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-lifecycled/go.mod
          cache-dependency-path: |
            tools/fased-lifecycled/go.sum
            tools/fased-signerd/go.sum

      - name: Build exact Linux-x64 artifact once
        env:
          FASED_LIFECYCLE_RELEASE_SEQUENCE: ${{ steps.channel.outputs.release_sequence }}
          FASED_LIFECYCLE_SECURITY_EPOCH: ${{ steps.channel.outputs.security_epoch }}
        run: bash scripts/build-linux-x64-release-artifact.sh "$RUNNER_TEMP/candidate/raw"

      - name: Finalize exact product inventory once
        env:
          RELEASE_SEQUENCE: ${{ steps.channel.outputs.release_sequence }}
          SECURITY_EPOCH: ${{ steps.channel.outputs.security_epoch }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/finalize-pretag-candidate.sh \
            "$RUNNER_TEMP/candidate/raw" "$RUNNER_TEMP/candidate/product" \
            "$RELEASE_VERSION" "$SOURCE_COMMIT" \
            "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            "$RELEASE_SEQUENCE" "$SECURITY_EPOCH"
          mkdir -p .artifacts/hosted-runtime
          cp -a "$RUNNER_TEMP/candidate/product/." .artifacts/hosted-runtime/

      - name: Attest signer
        id: signer
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-signerd-*
      - name: Stage signer attestation
        run: install -m 0644 "${{ steps.signer.outputs.bundle-path }}" .artifacts/hosted-runtime/fased-signerd-release.attestation.json

      - name: Attest lifecycle supervisor
        id: lifecycle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-lifecycled-*
      - name: Stage lifecycle attestation
        run: install -m 0644 "${{ steps.lifecycle.outputs.bundle-path }}" .artifacts/hosted-runtime/fased-lifecycled-release.attestation.json

      - name: Attest installer
        id: installer
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/install.sh
      - name: Stage installer attestation
        run: install -m 0644 "${{ steps.installer.outputs.bundle-path }}" .artifacts/hosted-runtime/install.sh.attestation.json

      - name: Attest release manifest
        id: manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-hosted-release-v2.json
      - name: Stage release-manifest attestation
        run: install -m 0644 "${{ steps.manifest.outputs.bundle-path }}" .artifacts/hosted-runtime/fased-hosted-release-v2.json.attestation.json

      - name: Attest privileged provenance
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json
      - name: Stage provenance attestation
        run: install -m 0644 "${{ steps.provenance.outputs.bundle-path }}" .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json.attestation.json

      - name: Attest lifecycle trust
        id: trust
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json
      - name: Stage lifecycle-trust attestation
        run: install -m 0644 "${{ steps.trust.outputs.bundle-path }}" .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json.attestation.json

      - name: Attest release index
        id: index
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-release-index-v1.json
      - name: Stage release-index attestation
        run: install -m 0644 "${{ steps.index.outputs.bundle-path }}" .artifacts/hosted-runtime/fased-release-index-v1.json.attestation.json

      - name: Attest lifecycle root head
        id: root-head
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-lifecycle-root-head-v1.json
      - name: Stage root-head attestation
        run: install -m 0644 "${{ steps.root-head.outputs.bundle-path }}" .artifacts/hosted-runtime/fased-lifecycle-root-head-v1.json.attestation.json

      - name: Bind final candidate descriptor
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-artifact-set.mjs build \
            --directory .artifacts/hosted-runtime \
            --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT" \
            --tree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --lockfile-digest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --source-ref "refs/tags/v$RELEASE_VERSION" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Attest final candidate descriptor
        id: descriptor
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-hosting-candidate.json
      - name: Stage descriptor attestation
        run: install -m 0644 "${{ steps.descriptor.outputs.bundle-path }}" .artifacts/hosted-runtime/fased-hosting-candidate.json.attestation.json

      - name: Upload exact candidate once
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-hosting-candidate
          path: .artifacts/hosted-runtime/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish and promote exact candidate
    needs: [prepare]
    environment: candidate-release
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fased-hosting-candidate
          path: .artifacts/hosted-runtime

      - name: Verify candidate and owner-created immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          descriptor=.artifacts/hosted-runtime/fased-hosting-candidate.json
          node scripts/release-artifact-set.mjs verify \
            --directory .artifacts/hosted-runtime --version "$RELEASE_VERSION" \
            --commit "$SOURCE_COMMIT" --tree "$(git rev-parse "$SOURCE_COMMIT^{tree}")" \
            --lockfile-digest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --source-ref "refs/tags/v$RELEASE_VERSION" --workflow-run-id "$GITHUB_RUN_ID"
          identity="$(node scripts/release-attestation-identity.mjs resolve \
            --bundle "$descriptor.attestation.json" --repository "$GITHUB_REPOSITORY")"
          GH_PROMPT_DISABLED=1 gh attestation verify "$descriptor" \
            --repo "$GITHUB_REPOSITORY" --bundle "$descriptor.attestation.json" \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "$(jq -er .sourceRef <<<"$identity")" \
            --source-digest "$(jq -er .sourceDigest <<<"$identity")" \
            --deny-self-hosted-runners >/dev/null
          tag="v$RELEASE_VERSION"
          if ! lines="$(git ls-remote --exit-code --tags origin \
            "refs/tags/$tag" "refs/tags/$tag^{}")"; then
            echo "Owner-created annotated tag $tag is required before candidate-release approval." >&2
            exit 1
          fi
          tag_object="$(awk -v ref="refs/tags/$tag" '$2 == ref {print $1}' <<<"$lines")"
          commit="$(awk -v ref="refs/tags/$tag^{}" '$2 == ref {print $1}' <<<"$lines")"
          [[ "$tag_object" =~ ^[a-f0-9]{40}$ && "$tag_object" != "$commit" ]]
          test "$commit" = "$SOURCE_COMMIT"

      - name: Publish exact release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Fased Agent $tag" --generate-notes)
            [[ "$RELEASE_VERSION" == *-* ]] && args+=(--prerelease)
            gh release create "$tag" .artifacts/hosted-runtime/* "${args[@]}"
          fi
          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$release_json"
          jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false' "$release_json" >/dev/null
          jq '[.assets[] | {name,size,digest}]' "$release_json" > "$RUNNER_TEMP/assets.json"
          node scripts/release-artifact-set.mjs verify-assets \
            --directory .artifacts/hosted-runtime --assets-json "$RUNNER_TEMP/assets.json"

      - name: Advance signed channel
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          attestation=.artifacts/hosted-runtime/fased-release-index-v1.json.attestation.json
          identity="$(node scripts/release-attestation-identity.mjs resolve \
            --bundle "$attestation" --repository "$GITHUB_REPOSITORY")"
          bash scripts/publish-lifecycle-channel.sh .artifacts/hosted-runtime "$SOURCE_COMMIT" \
            "$(jq -er .sourceRef <<<"$identity")" "$(jq -er .sourceDigest <<<"$identity")"

      - name: Record minimal release receipt
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          mkdir -p .artifacts/release-receipt
          jq -n --arg version "$RELEASE_VERSION" --arg commit "$SOURCE_COMMIT" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg artifactSetDigest "$(jq -er .artifactSetDigest .artifacts/hosted-runtime/fased-hosting-candidate.json)" \
            '{schemaVersion:1,role:"fased-candidate-publication",version:$version,commit:$commit,
              workflowRunId:$runId,artifactSetDigest:$artifactSetDigest}' \
            > .artifacts/release-receipt/evidence.json
      - name: Upload release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-candidate-publication
          path: .artifacts/release-receipt/evidence.json
          if-no-files-found: error
          retention-days: 30
