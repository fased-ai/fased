name: Hosted Runtime Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable tag whose candidate bytes will be promoted
        required: true
        type: string
      candidate_run_id:
        description: Tag workflow run that produced the complete candidate artifact
        required: true
        type: string
      gate_receipt_digest:
        description: Exact private github-release gate receipt digest
        required: true
        type: string

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: hosted-runtime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-gate:
    name: Verify exact release authorization
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Verify tag-only lifecycle release gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_RELEASE_ACTOR: ${{ vars.FASED_TRUSTED_RELEASE_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TRUSTED_RELEASE_ACTOR"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100" \
            --slurp | jq 'add' > "$RUNNER_TEMP/release-statuses.json"
          node scripts/verify-release-gate-status.mjs \
            --statuses "$RUNNER_TEMP/release-statuses.json" \
            --commit "$GITHUB_SHA" \
            --action tag \
            --trusted-actor "$TRUSTED_RELEASE_ACTOR" \
            --repository "$GITHUB_REPOSITORY"

  validate:
    name: Validate release contents
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Release validation exercises one frozen pre-generation updater
          # fixture stored at an immutable historical tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.34.5"
          cache-key-suffix: "hosted-runtime-node24"

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release contents once
        run: pnpm release:check

      - name: Enforce production vulnerability threshold
        run: pnpm audit --prod --audit-level high

  linux:
    name: Linux ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.34.5"
          cache-key-suffix: "hosted-runtime-node24"

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package hosted runtime artifact
        run: pnpm hosted:artifact:build --output .artifacts/hosted-runtime

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF#refs/tags/v}"
          test "$package_version" = "$tag_version"

      - name: Attest hosted runtime release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/hosted-runtime/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fased-hosted-runtime-linux-${{ matrix.arch }}
          path: .artifacts/hosted-runtime/*
          if-no-files-found: error

  signer:
    name: Native wallet signer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF#refs/tags/v}"
          test "$package_version" = "$tag_version"

      - name: Test native signer
        working-directory: tools/fased-signerd
        run: go test ./...

      - name: Enforce signer vulnerability threshold
        working-directory: tools/fased-signerd
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Build native signer release assets
        run: bash scripts/release-fased-signerd.sh

      - name: Stage root Hosting bootstrap release asset
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          bash -n install.sh
          node scripts/stamp-release-installer.mjs \
            --source install.sh \
            --output dist-native/release/install.sh \
            --version "$package_version"
          bash -n dist-native/release/install.sh
          grep -Fxq "install_entry_release_identity=\"${package_version}\"" \
            dist-native/release/install.sh
          install -m 0755 scripts/fased-lifecycle-supervisor.mjs dist-native/release/fased-lifecycle-supervisor.mjs
          install -m 0755 scripts/fased-host-updater.mjs dist-native/release/fased-host-updater.mjs
          install -m 0755 scripts/fased-host-updaterctl.mjs dist-native/release/fased-host-updaterctl.mjs
          install -m 0755 scripts/privileged-release-evidence.mjs \
            dist-native/release/fased-privileged-release-evidence.mjs

      - name: Verify native signer checksums
        working-directory: dist-native/release
        run: sha256sum --check fased-signerd-checksums.txt

      - name: Attest native signer release assets
        id: attest-native-signer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest@v4
        with:
          subject-path: dist-native/release/fased-signerd-*

      - name: Stage native signer attestation bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-native-signer.outputs.bundle-path }}" \
            dist-native/release/fased-signerd-release.attestation.json

      - name: Attest root Hosting bootstrap
        id: attest-hosting-bootstrap
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest@v4
        with:
          subject-path: dist-native/release/install.sh

      - name: Stage root Hosting bootstrap attestation bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-hosting-bootstrap.outputs.bundle-path }}" \
            dist-native/release/install.sh.attestation.json

      - name: Attest stable lifecycle supervisor
        id: attest-lifecycle-supervisor
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest@v4
        with:
          subject-path: dist-native/release/fased-lifecycle-supervisor.mjs

      - name: Stage stable lifecycle supervisor attestation bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-lifecycle-supervisor.outputs.bundle-path }}" \
            dist-native/release/fased-lifecycle-supervisor.mjs.attestation.json

      - name: Attest root Hosting updater controller
        id: attest-hosting-updater
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest@v4
        with:
          subject-path: dist-native/release/fased-host-updater.mjs

      - name: Stage root Hosting updater attestation bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-hosting-updater.outputs.bundle-path }}" \
            dist-native/release/fased-host-updater.mjs.attestation.json

      - name: Attest root Hosting updater client
        id: attest-hosting-updater-client
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest@v4
        with:
          subject-path: dist-native/release/fased-host-updaterctl.mjs

      - name: Stage root Hosting updater client attestation bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-hosting-updater-client.outputs.bundle-path }}" \
            dist-native/release/fased-host-updaterctl.mjs.attestation.json

      - name: Upload verified signer assets
        uses: actions/upload-artifact@v4
        with:
          name: fased-signerd-release
          path: dist-native/release/*
          if-no-files-found: error

  candidate:
    name: Assemble offline-attested candidate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux, signer]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v6

      - name: Download candidate architecture and signer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fased-*
          path: .artifacts/hosted-runtime
          merge-multiple: true

      - name: Assemble candidate release manifest
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          node scripts/build-hosted-release-manifest.mjs \
            --assets .artifacts/hosted-runtime \
            --version "$package_version" \
            --commit "$GITHUB_SHA" \
            --output .artifacts/hosted-runtime/fased-hosted-release-v2.json
          readarray -t lifecycle_times < <(node -e '
            const issued = new Date(process.argv[1]);
            const expires = new Date(issued.getTime() + 365 * 24 * 60 * 60 * 1000);
            process.stdout.write(`${issued.toISOString()}\n${expires.toISOString()}\n`);
          ' "$(git show -s --format=%cI "$GITHUB_SHA")")
          node scripts/privileged-release-evidence.mjs build \
            --assets .artifacts/hosted-runtime \
            --version "$package_version" \
            --commit "$GITHUB_SHA" \
            --issued-at "${lifecycle_times[0]}" \
            --vex-decisions release/vulnerability-decisions-v1.json \
            --output-dir .artifacts/hosted-runtime
          node scripts/build-lifecycle-trust-metadata.mjs \
            --assets .artifacts/hosted-runtime \
            --root-policy release/lifecycle-trust/root-v1/fased-lifecycle-root-v1.json \
            --version "$package_version" \
            --commit "$GITHUB_SHA" \
            --issued-at "${lifecycle_times[0]}" \
            --expires-at "${lifecycle_times[1]}" \
            --output .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json

      - name: Attest unified candidate manifest
        id: attest-candidate-manifest
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-hosted-release-v2.json

      - name: Stage candidate manifest attestation bundle
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-candidate-manifest.outputs.bundle-path }}" \
            .artifacts/hosted-runtime/fased-hosted-release-v2.json.attestation.json
          for required in \
            fased-signerd-release.attestation.json \
            install.sh.attestation.json \
            fased-lifecycle-supervisor.mjs.attestation.json \
            fased-host-updater.mjs.attestation.json \
            fased-host-updaterctl.mjs.attestation.json; do
            test -s ".artifacts/hosted-runtime/${required}"
          done

      - name: Attest privileged release provenance
        id: attest-candidate-provenance
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json

      - name: Stage privileged provenance attestation bundle
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-candidate-provenance.outputs.bundle-path }}" \
            .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json.attestation.json

      - name: Attest lifecycle trust metadata
        id: attest-candidate-lifecycle-trust
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json

      - name: Stage lifecycle trust attestation bundle
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-candidate-lifecycle-trust.outputs.bundle-path }}" \
            .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json.attestation.json

      - name: Verify every staged candidate attestation offline
        shell: bash
        env:
          GH_PROMPT_DISABLED: "1"
        run: |
          set -euo pipefail
          cd .artifacts/hosted-runtime
          verify() {
            gh attestation verify "$1" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$2" \
              --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners >/dev/null
          }
          verify fased-hosted-release-v2.json fased-hosted-release-v2.json.attestation.json
          verify fased-lifecycle-trust-v1.json fased-lifecycle-trust-v1.json.attestation.json
          verify fased-privileged-provenance-v1.intoto.json \
            fased-privileged-provenance-v1.intoto.json.attestation.json
          verify fased-signerd-linux-amd64 fased-signerd-release.attestation.json
          verify install.sh install.sh.attestation.json
          verify fased-lifecycle-supervisor.mjs fased-lifecycle-supervisor.mjs.attestation.json
          verify fased-host-updater.mjs fased-host-updater.mjs.attestation.json
          verify fased-host-updaterctl.mjs fased-host-updaterctl.mjs.attestation.json
          node ../../scripts/privileged-release-evidence.mjs verify \
            --release-manifest fased-hosted-release-v2.json \
            --lifecycle-metadata fased-lifecycle-trust-v1.json \
            --provenance fased-privileged-provenance-v1.intoto.json \
            --sbom fased-privileged-sbom-v1.spdx.json \
            --vex fased-privileged-vex-v1.openvex.json \
            --version "$(node -p "require('../../package.json').version")" \
            --commit "$GITHUB_SHA"

      - name: Bind the complete candidate artifact set
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          node scripts/release-artifact-set.mjs build \
            --directory .artifacts/hosted-runtime \
            --version "$package_version" \
            --commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Attest the complete candidate descriptor
        id: attest-candidate-descriptor
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-hosting-candidate.json

      - name: Stage and verify the exact promotion descriptor
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-candidate-descriptor.outputs.bundle-path }}" \
            .artifacts/hosted-runtime/fased-hosting-candidate.json.attestation.json
          gh attestation verify \
            .artifacts/hosted-runtime/fased-hosting-candidate.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle .artifacts/hosted-runtime/fased-hosting-candidate.json.attestation.json \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners >/dev/null
          package_version="$(node -p "require('./package.json').version")"
          node scripts/release-artifact-set.mjs verify \
            --directory .artifacts/hosted-runtime \
            --version "$package_version" \
            --commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Upload complete non-publishing candidate
        uses: actions/upload-artifact@v4
        with:
          name: fased-hosting-candidate
          path: .artifacts/hosted-runtime/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Promote exact verified candidate bytes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Download the complete tag-built candidate
        uses: actions/download-artifact@v4
        with:
          name: fased-hosting-candidate
          path: .artifacts/hosted-runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify exact candidate identity and release authorization
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_RELEASE_ACTOR: ${{ vars.FASED_TRUSTED_RELEASE_ACTOR }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GATE_RECEIPT_DIGEST: ${{ inputs.gate_receipt_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TRUSTED_RELEASE_ACTOR"
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v${package_version}"
          release_commit="$(git rev-parse HEAD)"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          candidate_verification="$(node scripts/release-artifact-set.mjs verify \
            --directory .artifacts/hosted-runtime \
            --version "$package_version" \
            --commit "$release_commit" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --workflow-run-id "$CANDIDATE_RUN_ID")"
          promotion_artifact_set_digest="$(jq -er .promotionArtifactSetDigest <<<"$candidate_verification")"
          gh attestation verify \
            .artifacts/hosted-runtime/fased-hosting-candidate.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle .artifacts/hosted-runtime/fased-hosting-candidate.json.attestation.json \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --deny-self-hosted-runners >/dev/null
          gh attestation verify \
            .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle \
              .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json.attestation.json \
            --signer-workflow fased-ai/fased/.github/workflows/hosted-runtime-release.yml \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --deny-self-hosted-runners >/dev/null
          node scripts/privileged-release-evidence.mjs verify \
            --release-manifest .artifacts/hosted-runtime/fased-hosted-release-v2.json \
            --lifecycle-metadata .artifacts/hosted-runtime/fased-lifecycle-trust-v1.json \
            --provenance .artifacts/hosted-runtime/fased-privileged-provenance-v1.intoto.json \
            --sbom .artifacts/hosted-runtime/fased-privileged-sbom-v1.spdx.json \
            --vex .artifacts/hosted-runtime/fased-privileged-vex-v1.openvex.json \
            --version "$package_version" \
            --commit "$release_commit"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$release_commit/statuses?per_page=100" \
            --slurp | jq 'add' > "$RUNNER_TEMP/release-statuses.json"
          node scripts/verify-release-gate-status.mjs \
            --statuses "$RUNNER_TEMP/release-statuses.json" \
            --commit "$release_commit" \
            --action github-release \
            --trusted-actor "$TRUSTED_RELEASE_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --receipt-digest "$GATE_RECEIPT_DIGEST" \
            --artifact-set-digest "$promotion_artifact_set_digest"

      - name: Publish one draft and expose it only after every byte uploads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          existing_release_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')"
          if [[ -n "$existing_release_id" ]]; then
            echo "Release already exists; refusing non-atomic overwrite: $RELEASE_TAG" >&2
            exit 1
          fi
          created=false
          release_id=""
          cleanup() {
            if [[ "$created" == true && -n "$release_id" ]]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          release_json="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$(git rev-parse HEAD)" \
            -f name="Fased Agent $RELEASE_TAG" \
            -F draft=true \
            -F prerelease=false \
            -F generate_release_notes=true)"
          release_id="$(jq -er .id <<<"$release_json")"
          created=true
          gh release upload "$RELEASE_TAG" .artifacts/hosted-runtime/* \
            --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '[.assets[] | {name,size,digest}]' > "$RUNNER_TEMP/release-assets.json"
          node scripts/release-artifact-set.mjs verify-assets \
            --directory .artifacts/hosted-runtime \
            --assets-json "$RUNNER_TEMP/release-assets.json"
          if [[ "$package_version" == *-* ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          else
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          fi
          created=false
          trap - EXIT
