name: Hosted Runtime Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosted-runtime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          check-latest: true

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.23.0"
          cache-key-suffix: "hosted-runtime-node24"

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime
        run: pnpm build

      - name: Check release package
        run: pnpm release:check

      - name: Build hosted runtime artifact
        run: pnpm hosted:artifact --output .artifacts/hosted-runtime

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF#refs/tags/v}"
          test "$package_version" = "$tag_version"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fased-hosted-runtime-linux-x64
          path: .artifacts/hosted-runtime/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Fased Agent $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" .artifacts/hosted-runtime/* --clobber
