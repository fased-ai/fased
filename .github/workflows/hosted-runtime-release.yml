name: Hosted Runtime Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: hosted-runtime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Validate release contents
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          check-latest: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.23.0"
          cache-key-suffix: "hosted-runtime-node24"

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release contents once
        run: pnpm release:check

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          check-latest: true

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.23.0"
          cache-key-suffix: "hosted-runtime-node24"

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package hosted runtime artifact
        run: pnpm hosted:artifact:build --output .artifacts/hosted-runtime

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF#refs/tags/v}"
          test "$package_version" = "$tag_version"

      - name: Attest hosted runtime release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/hosted-runtime/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fased-hosted-runtime-linux-${{ matrix.arch }}
          path: .artifacts/hosted-runtime/*
          if-no-files-found: error

  signer:
    name: Native wallet signer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF#refs/tags/v}"
          test "$package_version" = "$tag_version"

      - name: Test native signer
        working-directory: tools/fased-signerd
        run: go test ./...

      - name: Build native signer release assets
        run: bash scripts/release-fased-signerd.sh

      - name: Stage root Hosting bootstrap release asset
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          install -m 0755 install.sh dist-native/release/install.sh

      - name: Verify native signer checksums
        working-directory: dist-native/release
        run: sha256sum --check fased-signerd-checksums.txt

      - name: Attest native signer release assets
        id: attest-native-signer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: dist-native/release/fased-signerd-*

      - name: Stage native signer attestation bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-native-signer.outputs.bundle-path }}" \
            dist-native/release/fased-signerd-release.attestation.json

      - name: Attest root Hosting bootstrap
        id: attest-hosting-bootstrap
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: dist-native/release/install.sh

      - name: Stage root Hosting bootstrap attestation bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-hosting-bootstrap.outputs.bundle-path }}" \
            dist-native/release/install.sh.attestation.json

      - name: Upload verified signer assets
        uses: actions/upload-artifact@v4
        with:
          name: fased-signerd-release
          path: dist-native/release/*
          if-no-files-found: error

  publish:
    name: Publish verified runtime assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux, signer]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v6

      - name: Download verified architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fased-*
          path: .artifacts/hosted-runtime
          merge-multiple: true

      - name: Assemble one app and signer release manifest
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          node scripts/build-hosted-release-manifest.mjs \
            --assets .artifacts/hosted-runtime \
            --version "$package_version" \
            --commit "$GITHUB_SHA" \
            --output .artifacts/hosted-runtime/fased-hosted-release-v2.json

      - name: Attest unified hosted release manifest
        id: attest-hosted-release-manifest
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/hosted-runtime/fased-hosted-release-v2.json

      - name: Stage unified manifest attestation bundle
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            "${{ steps.attest-hosted-release-manifest.outputs.bundle-path }}" \
            .artifacts/hosted-runtime/fased-hosted-release-v2.json.attestation.json

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Fased Agent $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" .artifacts/hosted-runtime/* --repo "$GITHUB_REPOSITORY" --clobber
