name: Hosted Runtime Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosted-runtime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          check-latest: true

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.23.0"
          cache-key-suffix: "hosted-runtime-node24"

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, check, and package hosted runtime artifact
        run: pnpm hosted:artifact --output .artifacts/hosted-runtime

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF#refs/tags/v}"
          test "$package_version" = "$tag_version"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fased-hosted-runtime-linux-${{ matrix.arch }}
          path: .artifacts/hosted-runtime/*
          if-no-files-found: error

  publish:
    name: Publish verified runtime assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fased-hosted-runtime-linux-*
          path: .artifacts/hosted-runtime
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Fased Agent $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" .artifacts/hosted-runtime/* --repo "$GITHUB_REPOSITORY" --clobber
