name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 7 * * *"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run every supported CI lane regardless of changed paths
        required: true
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Resolve one authoritative changed-surface plan for PRs and main pushes.
  # Manual runs and failed/empty diffs fail safe to the complete supported matrix.
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      authority_version: ${{ steps.scope.outputs.authority_version }}
      plan_digest: ${{ steps.scope.outputs.plan_digest }}
      gate_plan_json: ${{ steps.scope.outputs.gate_plan_json }}
      changed_test_paths_json: ${{ steps.scope.outputs.changed_test_paths_json }}
      changed_ui_browser_tests: ${{ steps.scope.outputs.changed_ui_browser_tests }}
      phase: ${{ steps.scope.outputs.phase }}
      entry_points_json: ${{ steps.scope.outputs.entry_points_json }}
      change_kind: ${{ steps.scope.outputs.change_kind }}
      manual_review_required: ${{ steps.scope.outputs.manual_review_required }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      docs_changed: ${{ steps.scope.outputs.docs_changed }}
      version_only: ${{ steps.scope.outputs.version_only }}
      ci_infrastructure_only: ${{ steps.scope.outputs.ci_infrastructure_only }}
      t2_fixture_only: ${{ steps.scope.outputs.t2_fixture_only }}
      test_only: ${{ steps.scope.outputs.test_only }}
      fixture_only: ${{ steps.scope.outputs.fixture_only }}
      production_changed: ${{ steps.scope.outputs.production_changed }}
      privilege_changed: ${{ steps.scope.outputs.privilege_changed }}
      reuse_pr_checks: ${{ steps.scope.outputs.reuse_pr_checks }}
      run_node: ${{ steps.scope.outputs.run_node }}
      dependency_remediation: ${{ steps.scope.outputs.dependency_remediation }}
      focused_local_update: ${{ steps.scope.outputs.focused_local_update }}
      run_dependency_integrity: ${{ steps.scope.outputs.run_dependency_integrity }}
      run_node_focused: ${{ steps.scope.outputs.run_node_focused }}
      run_node_build: ${{ steps.scope.outputs.run_node_build }}
      run_node_packaging: ${{ steps.scope.outputs.run_node_packaging }}
      run_node_full: ${{ steps.scope.outputs.run_node_full }}
      run_node_unit: ${{ steps.scope.outputs.run_node_unit }}
      run_node_gateway: ${{ steps.scope.outputs.run_node_gateway }}
      run_node_extensions: ${{ steps.scope.outputs.run_node_extensions }}
      run_ui: ${{ steps.scope.outputs.run_ui }}
      run_macos_runtime: ${{ steps.scope.outputs.run_macos_runtime }}
      run_macos_app: ${{ steps.scope.outputs.run_macos_app }}
      experimental_mobile_changed: ${{ steps.scope.outputs.experimental_mobile_changed }}
      run_signer: ${{ steps.scope.outputs.run_signer }}
      run_native_signer: ${{ steps.scope.outputs.run_native_signer }}
      run_signer_integration: ${{ steps.scope.outputs.run_signer_integration }}
      run_signer_darwin_integration: ${{ steps.scope.outputs.run_signer_darwin_integration }}
      run_platform_bootstrap: ${{ steps.scope.outputs.run_platform_bootstrap }}
      run_docker: ${{ steps.scope.outputs.run_docker }}
      run_codeql_javascript: ${{ steps.scope.outputs.run_codeql_javascript }}
      run_codeql_go: ${{ steps.scope.outputs.run_codeql_go }}
      run_codeql_python: ${{ steps.scope.outputs.run_codeql_python }}
      run_hosting: ${{ steps.scope.outputs.run_hosting }}
      run_hosting_fresh: ${{ steps.scope.outputs.run_hosting_fresh }}
      run_hosting_update: ${{ steps.scope.outputs.run_hosting_update }}
      run_local_fresh: ${{ steps.scope.outputs.run_local_fresh }}
      run_local_update: ${{ steps.scope.outputs.run_local_update }}
      run_ci_contracts: ${{ steps.scope.outputs.run_ci_contracts }}
      run_t2_contracts: ${{ steps.scope.outputs.run_t2_contracts }}
      run_ui_mining: ${{ steps.scope.outputs.run_ui_mining }}
      run_skills: ${{ steps.scope.outputs.run_skills }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Resolve trusted private CI route
        id: private-route
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FASED_PRIVATE_STATUS_ACTOR: ${{ vars.FASED_PRIVATE_STATUS_ACTOR }}
          FASED_PRIVATE_STATUS_ACTOR_ID: ${{ vars.FASED_PRIVATE_STATUS_ACTOR_ID }}
        run: node scripts/ci-private-route-status.mjs

      - name: Prove tested PR tree for merged main
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-merged-main-reuse.mjs

      - name: Detect changed scopes
        id: scope
        env:
          FULL_MATRIX: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)) && 'true' || 'false' }}
          REUSE_PR_CHECKS: ${{ steps.reuse.outputs.reuse_pr_checks }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_PHASE: ${{ steps.private-route.outputs.gate_phase || 'T3' }}
          GATE_ROUTE: ${{ steps.private-route.outputs.gate_route }}
          GATE_ENTRY_POINT: ${{ steps.private-route.outputs.gate_entry_point }}
          GATE_EXPECTED_PLAN_DIGEST: ${{ steps.private-route.outputs.expected_plan_digest }}
        run: node scripts/ci-change-scope.mjs

  # CI routing is executable product policy. Validate it without rebuilding or
  # launching product fixtures when only that policy changes.
  ci-contracts:
    name: "CI routing contracts"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_ci_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check CI authority formatting and lint
        run: |
          pnpm exec oxfmt --check \
            .github/actions/setup-node-env/action.yml \
            .github/actions/setup-pnpm-store-cache/action.yml \
            .github/actions/setup-trivy-cache/action.yml \
            .github/workflows/ci.yml \
            .github/workflows/docker-release.yml \
            .github/workflows/formal-conformance.yml \
            .github/workflows/hosted-runtime-release.yml \
            .github/workflows/install-smoke.yml \
            .github/workflows/provider-catalog-refresh.yml \
            .github/workflows/sandbox-common-smoke.yml \
            .github/workflows/stale.yml \
            .github/workflows/workflow-sanity.yml \
            scripts/gate-authority.mjs \
            scripts/gate-authority.test.ts \
            config/lifecycle-compatibility.v1.json \
            scripts/lifecycle-compatibility-inventory.mjs \
            scripts/lifecycle-compatibility-inventory.test.ts \
            scripts/ci-change-scope.mjs \
            scripts/ci-change-scope.test.ts \
            scripts/ci-run-changed-tests.mjs \
            scripts/ci-run-changed-tests.test.ts \
            scripts/ci-private-route-status.mjs \
            scripts/ci-private-route-status.test.ts \
            scripts/ci-required-gates.mjs \
            scripts/ci-required-gates.test.ts \
            scripts/ci-workflow-contract.test.ts \
            ui/vitest.changed-node.config.ts
          pnpm exec oxlint \
            scripts/gate-authority.mjs \
            scripts/gate-authority.test.ts \
            scripts/lifecycle-compatibility-inventory.mjs \
            scripts/lifecycle-compatibility-inventory.test.ts \
            scripts/ci-change-scope.mjs \
            scripts/ci-change-scope.test.ts \
            scripts/ci-run-changed-tests.mjs \
            scripts/ci-run-changed-tests.test.ts \
            scripts/ci-private-route-status.mjs \
            scripts/ci-private-route-status.test.ts \
            scripts/ci-required-gates.mjs \
            scripts/ci-required-gates.test.ts \
            scripts/ci-workflow-contract.test.ts \
            ui/vitest.changed-node.config.ts

      - name: Check CI routing and gate contracts
        run: >-
          pnpm exec vitest run
          scripts/gate-authority.test.ts
          scripts/lifecycle-compatibility-inventory.test.ts
          scripts/ci-change-scope.test.ts
          scripts/ci-run-changed-tests.test.ts
          scripts/ci-private-route-status.test.ts
          scripts/ci-required-gates.test.ts
          scripts/ci-merged-main-reuse.test.ts
          scripts/ci-version-identity.test.ts
          scripts/ci-workflow-contract.test.ts

      - name: Check version-neutral lifecycle compatibility evidence
        run: node scripts/lifecycle-compatibility-inventory.mjs --verify-git

      - name: Check workflow semantics
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.11"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " $archive\$" "$RUNNER_TEMP/checksums.txt" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          python3 scripts/check-composite-action-input-interpolation.py

  # T2 harness-only edits prove their own source contracts without rebuilding
  # Fased or launching fresh Local/Hosting fixtures. This is SUPPORTING evidence;
  # the authoritative same-host generated-unit transaction remains a local T2 gate.
  t2-contracts:
    name: "T2 harness contracts"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_t2_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check exact T2 harness formatting
        run: >-
          pnpm exec oxfmt --check
          scripts/protected-local-t2-controller-worker.mjs
          scripts/protected-local-t2-supervisor-worker.mjs
          scripts/protected-local-t2-systemd-fixture.mjs
          scripts/protected-local-t2-systemd.test.ts
          scripts/test-protected-local-t2-systemd.sh

      - name: Run the six T2 source contracts
        run: >-
          pnpm exec vitest run
          scripts/protected-local-service-plan.test.ts
          scripts/protected-local-t2-systemd.test.ts
          --pool=forks --maxWorkers=1

  # The trusted lifecycle route selects this bounded Local-update lane. Keep
  # commands allowlisted in workflow source; never execute commands supplied by
  # a PR label, manifest, or status description.
  node-focused:
    name: "focused Node tests"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_focused == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check focused Local-update source
        run: |
          pnpm exec oxfmt --check \
            config/lifecycle-compatibility.v1.json \
            docs/reference/ci.md \
            package.json \
            scripts/ci-change-scope.mjs \
            scripts/ci-change-scope.test.ts \
            scripts/fased-lifecycle-supervisor.mjs \
            scripts/fased-local-recovery-pending.test.ts \
            scripts/fased-managed-updater-core.mjs \
            scripts/fased-managed-updater.test.ts \
            scripts/gate-authority.mjs \
            scripts/lifecycle-control-normalizer.mjs \
            scripts/lifecycle-control-normalizer.test.ts \
            scripts/protected-local-bootstrap.mjs \
            scripts/protected-local-bootstrap.test.ts \
            scripts/protected-local-controller.test.ts \
            scripts/protected-local-service-plan.mjs \
            scripts/protected-local-service-plan.test.ts \
            scripts/protected-local-t2-systemd-fixture.mjs \
            scripts/release-check.ts
          pnpm exec oxlint \
            scripts/ci-change-scope.mjs \
            scripts/ci-change-scope.test.ts \
            scripts/fased-lifecycle-supervisor.mjs \
            scripts/fased-local-recovery-pending.test.ts \
            scripts/fased-managed-updater-core.mjs \
            scripts/fased-managed-updater.test.ts \
            scripts/gate-authority.mjs \
            scripts/lifecycle-control-normalizer.mjs \
            scripts/lifecycle-control-normalizer.test.ts \
            scripts/protected-local-bootstrap.mjs \
            scripts/protected-local-bootstrap.test.ts \
            scripts/protected-local-controller.test.ts \
            scripts/protected-local-service-plan.mjs \
            scripts/protected-local-service-plan.test.ts \
            scripts/protected-local-t2-systemd-fixture.mjs \
            scripts/release-check.ts

      - name: Run focused Local-update regressions
        run: >-
          pnpm exec vitest run
          scripts/lifecycle-control-normalizer.test.ts
          scripts/protected-local-bootstrap.test.ts
          scripts/protected-local-service-plan.test.ts
          scripts/fased-local-recovery-pending.test.ts
          src/wallet/wallet-application-state-permissions.test.ts
          --pool=forks
          --maxWorkers=1

      - name: Prove cross-UID supervisor client traversal
        run: sudo -n bash scripts/test-protected-local-supervisor-client-root-fixture.sh

  node-unit:
    name: "Node unit tests"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run unit tests
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.change-scope.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs unit

  node-gateway:
    name: "Node Gateway tests"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run exact changed Gateway tests
        if: needs.change-scope.outputs.test_only == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.change-scope.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs gateway

      - name: Run Gateway subsystem tests
        if: needs.change-scope.outputs.test_only != 'true'
        run: >-
          pnpm canvas:a2ui:bundle &&
          pnpm exec vitest run
          --config vitest.gateway.config.ts
          --pool=forks
          --maxWorkers=2

  node-extensions:
    name: "Node extension tests"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run exact changed extension tests
        if: needs.change-scope.outputs.test_only == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.change-scope.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs extensions

      - name: Run extension subsystem tests
        if: needs.change-scope.outputs.test_only != 'true'
        run: >-
          pnpm canvas:a2ui:bundle &&
          pnpm exec vitest run
          --config vitest.extensions.config.ts
          --pool=forks
          --maxWorkers=2

  dependency-integrity:
    name: "dependency integrity"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_dependency_integrity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-key-suffix: "dependency-integrity-node22"

      - name: Prove exact override-only remediation
        if: needs.change-scope.outputs.dependency_remediation == 'true'
        env:
          DEPENDENCY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-dependency-integrity.mjs

      - name: Verify frozen lockfile
        run: pnpm install --lockfile-only --ignore-scripts --frozen-lockfile --prefer-offline

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # Build dist once for Node-relevant changes and share it with downstream jobs.
  build-artifacts:
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.run_node_build == 'true' ||
      needs.change-scope.outputs.run_hosting == 'true' ||
      needs.change-scope.outputs.run_local_fresh == 'true' ||
      needs.change-scope.outputs.run_local_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build dist
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  # Validate npm pack contents after build before merge and again on main.
  release-check:
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_node_packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-build
          path: dist/

      - name: Check release contents
        run: pnpm release:validate-dist:contracts

  # Keep the real packed fresh-install smoke independent of the contract suite.
  # Both consume the exact same built dist, so this shortens the release gate
  # without rebuilding or dropping either validation path.
  packed-core-smoke:
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_node_packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-build
          path: dist/

      - name: Run packed fresh-install smoke
        run: pnpm release:validate-dist:packed

  signer-platform:
    name: Native signer (${{ matrix.name }})
    needs: [change-scope]
    if: needs.change-scope.outputs.run_native_signer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Test native signer
        working-directory: tools/fased-signerd
        run: go test ./...

      - name: Build native signer for the runner
        working-directory: tools/fased-signerd
        run: go build -buildvcs=false -trimpath -o "${RUNNER_TEMP}/fased-signerd" .

      - name: Cross-compile every supported signer target
        if: runner.os == 'Linux'
        run: bash scripts/test-fased-signerd-portable-builds.sh

  signer-integration:
    name: "signer integration"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_signer_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Test JavaScript signer lifecycle integration
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm vitest run
          scripts/fased-managed-updater.local-signer.test.ts
          scripts/install-local-signer-transaction.test.ts
          scripts/install-platform-preflight.test.ts
          scripts/install-release-pin.test.ts
          src/wallet/providers/local-socket-signer-adapter.integration.test.ts
          src/wizard/onboarding.wallet.test.ts
          --pool=forks
          --maxWorkers=1

  signer-darwin-integration:
    name: "Darwin signer integration"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_signer_darwin_integration == 'true'
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Test Darwin signer lifecycle integration
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm vitest run
          scripts/fased-managed-updater.local-signer.test.ts
          scripts/install-local-signer-transaction.test.ts
          scripts/install-platform-preflight.test.ts
          scripts/install-release-pin.test.ts
          src/wallet/providers/local-socket-signer-adapter.integration.test.ts
          src/wizard/onboarding.wallet.test.ts
          --pool=forks
          --maxWorkers=1

  checks:
    name: "test (${{ matrix.runtime }}, ${{ matrix.task }})"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            task: unit-1of2
            test_lane: true
            groups: unit-fast
            shard_index: 1
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: unit-2of2
            test_lane: true
            groups: unit-fast
            shard_index: 2
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: support-isolated
            test_lane: true
            groups: unit-isolated
            shard_index: 0
            shard_count: 1
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-1of4
            test_lane: true
            groups: extensions
            shard_index: 1
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-2of4
            test_lane: true
            groups: extensions
            shard_index: 2
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-3of4
            test_lane: true
            groups: extensions
            shard_index: 3
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-4of4
            test_lane: true
            groups: extensions
            shard_index: 4
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: gateway-1of2
            test_lane: true
            groups: gateway
            shard_index: 1
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: gateway-2of2
            test_lane: true
            groups: gateway
            shard_index: 2
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: protocol
            test_lane: false
            command: pnpm protocol:check
          - runtime: bun
            task: test
            test_lane: false
            command: pnpm canvas:a2ui:bundle && bunx vitest run --config vitest.unit.config.ts
    steps:
      - name: Skip Bun outside the manual full matrix
        if: matrix.runtime == 'bun' && needs.change-scope.outputs.full_matrix != 'true'
        run: echo "Skipping the optional Bun compatibility lane."

      - name: Checkout
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "${{ matrix.runtime == 'bun' }}"

      - name: Configure vitest JSON reports
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: echo "FASED_VITEST_REPORT_DIR=$RUNNER_TEMP/vitest-reports" >> "$GITHUB_ENV"

      - name: Configure Node test resources
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: |
          # Split measured long-running groups onto independent runners.
          # Each matrix entry declares its shard count; suites remain serial
          # internally where deterministic process state is required.
          echo "FASED_TEST_GROUPS=${{ matrix.groups }}" >> "$GITHUB_ENV"
          echo "FASED_TEST_PROFILE=${{ matrix.profile }}" >> "$GITHUB_ENV"
          echo "FASED_TEST_WORKERS=2" >> "$GITHUB_ENV"
          echo "FASED_TEST_EXTENSIONS_WORKERS=1" >> "$GITHUB_ENV"
          echo "FASED_TEST_MAX_OLD_SPACE_SIZE_MB=4096" >> "$GITHUB_ENV"
          if [ "${{ matrix.shard_count }}" -gt 1 ]; then
            echo "FASED_TEST_SHARDS=${{ matrix.shard_count }}" >> "$GITHUB_ENV"
            echo "FASED_TEST_SHARD_INDEX=${{ matrix.shard_index }}" >> "$GITHUB_ENV"
          fi

      - name: Run ${{ matrix.task }} (${{ matrix.runtime }})
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        run: ${{ matrix.command }}

      - name: Summarize slowest tests
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: |
          node scripts/vitest-slowest.mjs --dir "$FASED_VITEST_REPORT_DIR" --top 50 --out "$RUNNER_TEMP/vitest-slowest.md" > /dev/null
          echo "Slowest test summary written to $RUNNER_TEMP/vitest-slowest.md"

      - name: Upload vitest reports
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-reports-${{ runner.os }}-${{ matrix.runtime }}-${{ matrix.task }}
          path: |
            ${{ env.FASED_VITEST_REPORT_DIR }}
            ${{ runner.temp }}/vitest-slowest.md

  # Public gate: format, lint, and policy checks. Repository-wide TypeScript debt
  # is enforced separately as a blocking no-new-errors baseline.
  check:
    name: "check"
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.run_node == 'true' &&
      needs.change-scope.outputs.focused_local_update != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check format and lint
        run: pnpm check:ci

      - name: Enforce safe external URL opening policy
        run: pnpm lint:ui:no-raw-window-open

  # Build one immutable fixture artifact only when a Local lifecycle gate needs
  # it. Hosting no longer serializes or owns this artifact.
  protected-local-fixture-artifact:
    name: "protected Local fixture artifact"
    needs: [change-scope, build-artifacts]
    if: >-
      needs.change-scope.outputs.run_local_fresh == 'true' ||
      needs.change-scope.outputs.run_local_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Download exact dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-build
          path: dist/

      - name: Build one exact fixture artifact
        env:
          FASED_SIGNER_BUILD_COMMIT: ${{ github.sha }}
          FASED_SIGNER_TARGETS: linux/amd64
        run: |
          set -euo pipefail
          started=$SECONDS
          artifact_dir="$RUNNER_TEMP/protected-local-artifact"
          bash scripts/release-fased-signerd.sh
          pnpm hosted:artifact:from-dist --output "$artifact_dir"
          cp -a dist-native/release/. "$artifact_dir/"
          echo "ci timing: stage=protected-local-fixture-artifact elapsed=$((SECONDS - started))s"

      - name: Upload exact fixture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/
          retention-days: 1

  hosting-lifecycle:
    name: "hosting lifecycle"
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_hosting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Download exact dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-build
          path: dist/

      - name: Check hosted runtime installer
        run: bash scripts/test-hosted-runtime-install.sh

      - name: Check exact streamed Hosting bootstrap
        run: bash scripts/test-streamed-hosting-bootstrap-container.sh

  protected-local-lifecycle:
    name: "protected Local fresh lifecycle (ubuntu)"
    needs: [change-scope, protected-local-fixture-artifact]
    if: needs.change-scope.outputs.run_local_fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x

      - name: Download exact Protected Local fixture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/

      - name: Restore cached systemd fixture base image
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-ubuntu-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}

      - name: Check clean Protected Local bootstrap
        env:
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_SCENARIOS: fresh-install
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/protected-local-artifact
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "1"
        run: bash scripts/test-protected-local-systemd-container.sh

  protected-local-rocky-lifecycle:
    name: "protected Local fresh lifecycle (rocky)"
    needs: [change-scope, protected-local-fixture-artifact]
    if: >-
      needs.change-scope.outputs.run_local_fresh == 'true' &&
      needs.change-scope.outputs.full_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x

      - name: Download exact Protected Local fixture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/

      - name: Restore cached systemd fixture base image
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-rocky-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}

      - name: Check Rocky compatibility bootstrap
        env:
          FASED_SYSTEMD_FIXTURE_DISTROS: rocky
          FASED_SYSTEMD_FIXTURE_SCENARIOS: fresh-install
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/protected-local-artifact
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "1"
        run: bash scripts/test-protected-local-systemd-container.sh

  protected-local-update-lifecycle:
    name: "protected Local update lifecycle (ubuntu)"
    needs: [change-scope, protected-local-fixture-artifact]
    if: needs.change-scope.outputs.run_local_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run Local recovery-pending T1
        run: >-
          pnpm exec vitest run
          scripts/fased-local-recovery-pending.test.ts
          --pool=forks
          --maxWorkers=1

      - name: Download exact Protected Local fixture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/

      - name: Restore cached systemd fixture base image
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-ubuntu-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}

      - name: Check Protected Local update, rollback, retry, and idempotence
        env:
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_SCENARIOS: install
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/protected-local-artifact
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "1"
        run: bash scripts/test-protected-local-systemd-container.sh

  platform-bootstrap-audit:
