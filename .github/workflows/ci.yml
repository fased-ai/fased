      - name: Download exact Protected Local fixture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/

      - name: Restore cached systemd fixture base image
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-ubuntu-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}

      - name: Check package-manager and missing-tool bootstrap
        env:
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_SCENARIOS: fresh-install
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/protected-local-artifact
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "0"
        run: bash scripts/test-protected-local-systemd-container.sh

  docker-amd64:
    name: "Docker amd64"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node test environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Test Docker setup and coordinated backup/rollback
        run: >-
          pnpm exec vitest run
          src/docker-setup.test.ts
          scripts/docker-signer-update.backup.test.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          tags: fased-local-ci:${{ github.sha }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=fased-pr-amd64
          cache-to: type=gha,scope=fased-pr-amd64,mode=max

      - name: Verify non-root runtime user
        env:
          IMAGE: fased-local-ci:${{ github.sha }}
        run: test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "node"

      - name: Verify native signer is packaged
        env:
          IMAGE: fased-local-ci:${{ github.sha }}
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(docker run --rm --entrypoint /usr/local/bin/fased-signerd "$IMAGE" --version)"
          test "$actual" = "fased-signerd ${expected} commit=unknown buildInputDigest=unknown development=true"

      - name: Setup Trivy cache
        uses: ./.github/actions/setup-trivy-cache

      - name: Scan local validation image
        env:
          IMAGE: fased-local-ci:${{ github.sha }}
        run: scripts/scan-docker-image.sh "$IMAGE" linux/amd64

  docker-arm64:
    name: "Docker arm64"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_docker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build native ARM64 signer export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: signer-artifact
          platforms: linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/fased-signer-arm64
          cache-from: type=gha,scope=fased-pr-signer-arm64
          cache-to: type=gha,scope=fased-pr-signer-arm64,mode=max

      - name: Execute container-built ARM64 signer
        shell: bash
        run: |
          set -euo pipefail
          signer="${RUNNER_TEMP}/fased-signer-arm64/fased-signerd"
          chmod 0555 "$signer"
          expected="$(node -p "require('./package.json').version")"
          actual="$("$signer" --version)"
          test "$actual" = "fased-signerd ${expected} commit=unknown buildInputDigest=unknown development=true"

  codeql-javascript:
