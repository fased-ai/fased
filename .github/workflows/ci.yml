name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run every supported CI lane regardless of changed paths
        required: true
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Resolve one authoritative changed-surface plan for PRs and main pushes.
  # Manual runs and failed/empty diffs fail safe to the complete supported matrix.
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      authority_version: ${{ steps.scope.outputs.authority_version }}
      plan_digest: ${{ steps.scope.outputs.plan_digest }}
      gate_plan_json: ${{ steps.scope.outputs.gate_plan_json }}
      phase: ${{ steps.scope.outputs.phase }}
      entry_points_json: ${{ steps.scope.outputs.entry_points_json }}
      change_kind: ${{ steps.scope.outputs.change_kind }}
      manual_review_required: ${{ steps.scope.outputs.manual_review_required }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      docs_changed: ${{ steps.scope.outputs.docs_changed }}
      version_only: ${{ steps.scope.outputs.version_only }}
      ci_infrastructure_only: ${{ steps.scope.outputs.ci_infrastructure_only }}
      t2_fixture_only: ${{ steps.scope.outputs.t2_fixture_only }}
      test_only: ${{ steps.scope.outputs.test_only }}
      fixture_only: ${{ steps.scope.outputs.fixture_only }}
      production_changed: ${{ steps.scope.outputs.production_changed }}
      privilege_changed: ${{ steps.scope.outputs.privilege_changed }}
      reuse_pr_checks: ${{ steps.scope.outputs.reuse_pr_checks }}
      run_node: ${{ steps.scope.outputs.run_node }}
      run_macos: ${{ steps.scope.outputs.run_macos }}
      run_signer: ${{ steps.scope.outputs.run_signer }}
      run_hosting: ${{ steps.scope.outputs.run_hosting }}
      run_hosting_fresh: ${{ steps.scope.outputs.run_hosting_fresh }}
      run_hosting_update: ${{ steps.scope.outputs.run_hosting_update }}
      run_local_fresh: ${{ steps.scope.outputs.run_local_fresh }}
      run_local_update: ${{ steps.scope.outputs.run_local_update }}
      run_ci_contracts: ${{ steps.scope.outputs.run_ci_contracts }}
      run_t2_contracts: ${{ steps.scope.outputs.run_t2_contracts }}
      run_ui_mining: ${{ steps.scope.outputs.run_ui_mining }}
      run_skills: ${{ steps.scope.outputs.run_skills }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Prove tested PR tree for merged main
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-merged-main-reuse.mjs

      - name: Detect changed scopes
        id: scope
        env:
          FULL_MATRIX: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix && 'true' || 'false' }}
          REUSE_PR_CHECKS: ${{ steps.reuse.outputs.reuse_pr_checks }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-change-scope.mjs

  # CI routing is executable product policy. Validate it without rebuilding or
  # launching product fixtures when only that policy changes.
  ci-contracts:
    name: "CI routing contracts"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_ci_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check CI routing and gate contracts
        run: >-
          pnpm exec vitest run
          scripts/gate-authority.test.ts
          scripts/ci-change-scope.test.ts
          scripts/ci-required-gates.test.ts
          scripts/ci-merged-main-reuse.test.ts
          scripts/ci-version-identity.test.ts
          scripts/ci-workflow-contract.test.ts

  # T2 harness-only edits prove their own source contracts without rebuilding
  # Fased or launching fresh Local/Hosting fixtures. This is SUPPORTING evidence;
  # the authoritative same-host generated-unit transaction remains a local T2 gate.
  t2-contracts:
    name: "T2 harness contracts"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_t2_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check exact T2 harness formatting
        run: >-
          pnpm exec oxfmt --check
          scripts/protected-local-t2-controller-worker.mjs
          scripts/protected-local-t2-supervisor-worker.mjs
          scripts/protected-local-t2-systemd-fixture.mjs
          scripts/protected-local-t2-systemd.test.ts
          scripts/test-protected-local-t2-systemd.sh

      - name: Run the six T2 source contracts
        run: >-
          pnpm exec vitest run
          scripts/protected-local-service-plan.test.ts
          scripts/protected-local-t2-systemd.test.ts
          --pool=forks --maxWorkers=1

  # Build dist once for Node-relevant changes and share it with downstream jobs.
  build-artifacts:
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.run_node == 'true' ||
      needs.change-scope.outputs.run_hosting == 'true' ||
      needs.change-scope.outputs.run_local_fresh == 'true' ||
      needs.change-scope.outputs.run_local_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build dist
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  # Validate npm pack contents after build before merge and again on main.
  release-check:
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Check release contents
        run: pnpm release:validate-dist:contracts

  # Keep the real packed fresh-install smoke independent of the contract suite.
  # Both consume the exact same built dist, so this shortens the release gate
  # without rebuilding or dropping either validation path.
  packed-core-smoke:
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Run packed fresh-install smoke
        run: pnpm release:validate-dist:packed

  signer-platform:
    name: Native signer (${{ matrix.name }})
    needs: [change-scope]
    if: needs.change-scope.outputs.run_signer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Test native signer
        working-directory: tools/fased-signerd
        run: go test ./...

      - name: Build native signer for the runner
        working-directory: tools/fased-signerd
        run: go build -buildvcs=false -trimpath -o "${RUNNER_TEMP}/fased-signerd" .

      - name: Cross-compile every supported signer target
        if: runner.os == 'Linux'
        run: bash scripts/test-fased-signerd-portable-builds.sh

      # The Go tests above prove the daemon on each native runner. These
      # focused integration tests additionally prove that the packaged
      # JavaScript updater, installer, onboarding, and socket adapter select
      # and operate the native Darwin signer. Keep this separate from the
      # unrelated Swift/macOS application lane.
      - name: Setup Node environment for Local signer integration
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Test Local signer lifecycle integration
        if: runner.os == 'macOS'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm vitest run
          scripts/fased-managed-updater.local-signer.test.ts
          scripts/install-local-signer-transaction.test.ts
          scripts/install-platform-preflight.test.ts
          scripts/install-release-pin.test.ts
          src/wallet/providers/local-socket-signer-adapter.integration.test.ts
          src/wizard/onboarding.wallet.test.ts
          --pool=forks
          --maxWorkers=1

  checks:
    name: "test (${{ matrix.runtime }}, ${{ matrix.task }})"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            task: unit-1of2
            test_lane: true
            groups: unit-fast
            shard_index: 1
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: unit-2of2
            test_lane: true
            groups: unit-fast
            shard_index: 2
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: support-isolated
            test_lane: true
            groups: unit-isolated
            shard_index: 0
            shard_count: 1
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-1of4
            test_lane: true
            groups: extensions
            shard_index: 1
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-2of4
            test_lane: true
            groups: extensions
            shard_index: 2
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-3of4
            test_lane: true
            groups: extensions
            shard_index: 3
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-4of4
            test_lane: true
            groups: extensions
            shard_index: 4
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: gateway-1of2
            test_lane: true
            groups: gateway
            shard_index: 1
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: gateway-2of2
            test_lane: true
            groups: gateway
            shard_index: 2
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: protocol
            test_lane: false
            command: pnpm protocol:check
          - runtime: bun
            task: test
            test_lane: false
            command: pnpm canvas:a2ui:bundle && bunx vitest run --config vitest.unit.config.ts
    steps:
      - name: Skip Bun outside the manual full matrix
        if: matrix.runtime == 'bun' && needs.change-scope.outputs.full_matrix != 'true'
        run: echo "Skipping the optional Bun compatibility lane."

      - name: Checkout
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "${{ matrix.runtime == 'bun' }}"

      - name: Configure vitest JSON reports
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: echo "FASED_VITEST_REPORT_DIR=$RUNNER_TEMP/vitest-reports" >> "$GITHUB_ENV"

      - name: Configure Node test resources
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: |
          # Split measured long-running groups onto independent runners.
          # Each matrix entry declares its shard count; suites remain serial
          # internally where deterministic process state is required.
          echo "FASED_TEST_GROUPS=${{ matrix.groups }}" >> "$GITHUB_ENV"
          echo "FASED_TEST_PROFILE=${{ matrix.profile }}" >> "$GITHUB_ENV"
          echo "FASED_TEST_WORKERS=2" >> "$GITHUB_ENV"
          echo "FASED_TEST_EXTENSIONS_WORKERS=1" >> "$GITHUB_ENV"
          echo "FASED_TEST_MAX_OLD_SPACE_SIZE_MB=4096" >> "$GITHUB_ENV"
          if [ "${{ matrix.shard_count }}" -gt 1 ]; then
            echo "FASED_TEST_SHARDS=${{ matrix.shard_count }}" >> "$GITHUB_ENV"
            echo "FASED_TEST_SHARD_INDEX=${{ matrix.shard_index }}" >> "$GITHUB_ENV"
          fi

      - name: Run ${{ matrix.task }} (${{ matrix.runtime }})
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        run: ${{ matrix.command }}

      - name: Summarize slowest tests
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: |
          node scripts/vitest-slowest.mjs --dir "$FASED_VITEST_REPORT_DIR" --top 50 --out "$RUNNER_TEMP/vitest-slowest.md" > /dev/null
          echo "Slowest test summary written to $RUNNER_TEMP/vitest-slowest.md"

      - name: Upload vitest reports
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports-${{ runner.os }}-${{ matrix.runtime }}-${{ matrix.task }}
          path: |
            ${{ env.FASED_VITEST_REPORT_DIR }}
            ${{ runner.temp }}/vitest-slowest.md

  # Public gate: format, lint, and policy checks. Repository-wide TypeScript debt
  # is enforced separately as a blocking no-new-errors baseline.
  check:
    name: "check"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check format and lint
        run: pnpm check:ci

      - name: Enforce safe external URL opening policy
        run: pnpm lint:ui:no-raw-window-open

  # Build one immutable fixture artifact only when a Local lifecycle gate needs
  # it. Hosting no longer serializes or owns this artifact.
  protected-local-fixture-artifact:
    name: "protected Local fixture artifact"
    needs: [change-scope, build-artifacts]
    if: >-
      needs.change-scope.outputs.run_local_fresh == 'true' ||
      needs.change-scope.outputs.run_local_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Download exact dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Build one exact fixture artifact
        env:
          FASED_SIGNER_BUILD_COMMIT: ${{ github.sha }}
          FASED_SIGNER_TARGETS: linux/amd64
        run: |
          set -euo pipefail
          started=$SECONDS
          artifact_dir="$RUNNER_TEMP/protected-local-artifact"
          bash scripts/release-fased-signerd.sh
          pnpm hosted:artifact:from-dist --output "$artifact_dir"
          cp -a dist-native/release/. "$artifact_dir/"
          echo "ci timing: stage=protected-local-fixture-artifact elapsed=$((SECONDS - started))s"

      - name: Upload exact fixture artifact
        uses: actions/upload-artifact@v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/
          retention-days: 1

  hosting-lifecycle:
    name: "hosting lifecycle"
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_hosting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Download exact dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Check hosted runtime installer
        run: bash scripts/test-hosted-runtime-install.sh

      - name: Check exact streamed Hosting bootstrap
        run: bash scripts/test-streamed-hosting-bootstrap-container.sh

  protected-local-lifecycle:
    name: "protected Local fresh lifecycle (ubuntu)"
    needs: [change-scope, protected-local-fixture-artifact]
    if: needs.change-scope.outputs.run_local_fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Download exact Protected Local fixture artifact
        uses: actions/download-artifact@v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/

      - name: Restore cached systemd fixture base image
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-ubuntu-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}

      - name: Check clean Protected Local bootstrap
        env:
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_SCENARIOS: fresh-install
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/protected-local-artifact
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "0"
        run: bash scripts/test-protected-local-systemd-container.sh

  protected-local-rocky-lifecycle:
    name: "protected Local fresh lifecycle (rocky)"
    needs: [change-scope, protected-local-fixture-artifact]
    if: >-
      needs.change-scope.outputs.run_local_fresh == 'true' &&
      needs.change-scope.outputs.full_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Download exact Protected Local fixture artifact
        uses: actions/download-artifact@v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/

      - name: Restore cached systemd fixture base image
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-rocky-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}

      - name: Check Rocky compatibility bootstrap
        env:
          FASED_SYSTEMD_FIXTURE_DISTROS: rocky
          FASED_SYSTEMD_FIXTURE_SCENARIOS: fresh-install
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/protected-local-artifact
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "1"
        run: bash scripts/test-protected-local-systemd-container.sh

  protected-local-update-lifecycle:
    name: "protected Local update lifecycle (ubuntu)"
    needs: [change-scope, protected-local-fixture-artifact]
    if: needs.change-scope.outputs.run_local_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run Local recovery-pending T1
        run: >-
          pnpm exec vitest run
          scripts/fased-local-recovery-pending.test.ts
          --pool=forks
          --maxWorkers=1

      - name: Download exact Protected Local fixture artifact
        uses: actions/download-artifact@v4
        with:
          name: protected-local-fixture-artifact
          path: ${{ runner.temp }}/protected-local-artifact/

      - name: Restore cached systemd fixture base image
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/protected-local-image-cache/
          key: >-
            protected-local-systemd-${{ runner.os }}-ubuntu-v1-
            ${{ hashFiles('scripts/docker/protected-local-systemd/Containerfile.*',
            'scripts/docker/protected-local-systemd/*.conf') }}

      - name: Check Protected Local update, rollback, retry, and idempotence
        env:
          FASED_SYSTEMD_FIXTURE_DISTROS: ubuntu
          FASED_SYSTEMD_FIXTURE_SCENARIOS: install
          FASED_SYSTEMD_FIXTURE_ARTIFACT_DIR: ${{ runner.temp }}/protected-local-artifact
          FASED_SYSTEMD_FIXTURE_IMAGE_CACHE_DIR: ${{ runner.temp }}/protected-local-image-cache
          FASED_SYSTEMD_FIXTURE_PREINSTALLED_TOOLS: "0"
        run: bash scripts/test-protected-local-systemd-container.sh

  version-identity:
    name: "version identity"
    needs: [change-scope]
    if: needs.change-scope.outputs.version_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Validate exact version-only diff
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-version-identity.mjs

  strict-types-baseline:
    name: "strict types baseline"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Reject new repository-wide TypeScript errors
        run: pnpm check:typescript:baseline

  ui-mining:
    name: "ui-mining"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_ui_mining == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Install Playwright Chromium for mining browser tests
        run: pnpm --dir ui exec playwright install chromium

      - name: Run Control UI mining browser tests
        run: pnpm test:ui:mining

      - name: Upload mining UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-mining-screenshots-${{ github.run_id }}
          if-no-files-found: ignore
          path: ui/src/ui/**/__screenshots__/

  ui:
    name: "ui"
    needs: [change-scope]
    if: needs.change-scope.outputs.full_matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Install Playwright Chromium for Control UI tests
        run: pnpm --dir ui exec playwright install chromium

      - name: Run full Control UI test suite
        run: pnpm test:ui

      - name: Upload full UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.run_id }}
          if-no-files-found: ignore
          path: ui/src/**/__screenshots__/

  # Report-only dead-code scans. Runs after scope detection and stores machine-readable
  # results as artifacts for later triage before we enable hard gates.
  # Temporarily disabled in CI while we process initial findings.
  deadcode:
    name: dead-code report
    needs: [change-scope]
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: knip
            command: pnpm deadcode:report:ci:knip
          - tool: ts-prune
            command: pnpm deadcode:report:ci:ts-prune
          - tool: ts-unused-exports
            command: pnpm deadcode:report:ci:ts-unused
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run ${{ matrix.tool }} dead-code scan
        run: ${{ matrix.command }}

      - name: Upload dead-code results
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-${{ matrix.tool }}-${{ github.run_id }}
          path: .artifacts/deadcode

  # Validate docs (format, lint, broken links) only when docs files changed.
  check-docs:
    needs: [change-scope]
    if: needs.change-scope.outputs.docs_changed == 'true' && needs.change-scope.outputs.version_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check docs
        run: pnpm check:docs

  skills-python:
    needs: [change-scope]
    if: needs.change-scope.outputs.run_skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pyyaml

      - name: Lint Python skill scripts
        run: python -m ruff check skills

      - name: Test skill Python scripts
        run: python -m pytest -q skills

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      # This job audits repository metadata and the lockfile; it does not run
      # project code, so installing the full dependency tree wastes ~45s.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-key-suffix: "secrets-node22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Resolve changed-file audit base
        id: audit-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" = "push" ]]; then
            base="$PUSH_BEFORE"
          else
            base="$PR_BASE_SHA"
          fi
          if [[ ! "$base" =~ ^[a-f0-9]{40}$ ]] || [[ "$base" = "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Detect secrets
        run: pre-commit run detect-secrets --from-ref "${{ steps.audit-base.outputs.base }}" --to-ref HEAD

      - name: Detect committed private keys
        run: pre-commit run detect-private-key --from-ref "${{ steps.audit-base.outputs.base }}" --to-ref HEAD

      - name: Audit changed GitHub workflows with zizmor
        env:
          BASE: ${{ steps.audit-base.outputs.base }}
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(git diff --name-only "$BASE" HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "No workflow changes detected; skipping zizmor."
            exit 0
          fi

          pre-commit run zizmor --files "${workflow_files[@]}"

      - name: Audit production dependencies
        run: pre-commit run --all-files pnpm-audit-prod

  checks-windows:
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.full_matrix == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Keep total concurrency predictable on the 16 vCPU runner:
      # `scripts/test-parallel.mjs` runs some vitest suites in parallel processes.
      FASED_TEST_WORKERS: 2
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            task: lint
            shard_index: 0
            shard_count: 1
            command: pnpm lint
          - runtime: node
            task: test
            shard_index: 1
            shard_count: 2
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: test
            shard_index: 2
            shard_count: 2
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: protocol
            shard_index: 0
            shard_count: 1
            command: pnpm protocol:check
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Try to exclude workspace from Windows Defender (best-effort)
        shell: pwsh
        run: |
          $cmd = Get-Command Add-MpPreference -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Host "Add-MpPreference not available, skipping Defender exclusions."
            exit 0
          }

          try {
            # Defender sometimes intercepts process spawning (vitest workers). If this fails
            # (eg hardened images), keep going and rely on worker limiting above.
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction Stop
            Write-Host "Defender exclusions applied."
          } catch {
            Write-Warning "Failed to apply Defender exclusions, continuing. $($_.Exception.Message)"
          }

      - name: Download dist artifact (lint lane)
        if: matrix.task == 'lint'
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Verify dist artifact (lint lane)
        if: matrix.task == 'lint'
        run: |
          set -euo pipefail
          test -s dist/index.js
          test -s dist/plugin-sdk/index.js

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.34.5"
          cache-key-suffix: "node22"

      - name: Runtime versions
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Capture node path
        run: echo "NODE_BIN=$(dirname \"$(node -p \"process.execPath\")\")" >> "$GITHUB_ENV"

      - name: Install dependencies
        env:
          CI: true
        run: |
          export PATH="$NODE_BIN:$PATH"
          which node
          node -v
          pnpm -v
          pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true || pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true

      - name: Configure test shard (Windows)
        if: matrix.task == 'test'
        run: |
          echo "FASED_TEST_SHARDS=${{ matrix.shard_count }}" >> "$GITHUB_ENV"
          echo "FASED_TEST_SHARD_INDEX=${{ matrix.shard_index }}" >> "$GITHUB_ENV"

      - name: Configure vitest JSON reports
        if: matrix.task == 'test'
        run: echo "FASED_VITEST_REPORT_DIR=$RUNNER_TEMP/vitest-reports" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.task }} (${{ matrix.runtime }})
        run: ${{ matrix.command }}

      - name: Summarize slowest tests
        if: matrix.task == 'test'
        run: |
          node scripts/vitest-slowest.mjs --dir "$FASED_VITEST_REPORT_DIR" --top 50 --out "$RUNNER_TEMP/vitest-slowest.md" > /dev/null
          echo "Slowest test summary written to $RUNNER_TEMP/vitest-slowest.md"

      - name: Upload vitest reports
        if: matrix.task == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports-${{ runner.os }}-${{ matrix.runtime }}-shard${{ matrix.shard_index }}of${{ matrix.shard_count }}
          path: |
            ${{ env.FASED_VITEST_REPORT_DIR }}
            ${{ runner.temp }}/vitest-slowest.md

  # Consolidated macOS job: runs TS tests + Swift lint/build/test sequentially
  # on a single runner. GitHub limits macOS concurrent jobs to 5 per org;
  # running 4 separate jobs per PR (as before) starved the queue. One job
  # per PR allows 5 PRs to run macOS checks simultaneously.
  macos:
    needs: [change-scope]
    if: needs.change-scope.outputs.run_macos == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      # --- Run all checks sequentially (fast gates first) ---
      - name: TS tests (macOS)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test

      # --- Xcode/Swift setup ---
      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version

      - name: Install XcodeGen / SwiftLint / SwiftFormat
        run: brew install xcodegen swiftlint swiftformat

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Swift lint
        run: |
          swiftlint --config .swiftlint.yml
          swiftformat --lint apps/macos/Sources --config .swiftformat

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Swift build (release)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if swift build --package-path apps/macos --configuration release; then
              exit 0
            fi
            echo "swift build failed (attempt $attempt/3). Retrying…"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Swift test
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if swift test --package-path apps/macos --parallel --enable-code-coverage --show-codecov-path; then
              exit 0
            fi
            echo "swift test failed (attempt $attempt/3). Retrying…"
            sleep $((attempt * 20))
          done
          exit 1

  ios:
    if: false # ignore iOS in CI for now
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install SwiftLint / SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Generate iOS project
        run: |
          cd apps/ios
          xcodegen generate

      - name: iOS tests
        run: |
          set -euo pipefail
          RESULT_BUNDLE_PATH="$RUNNER_TEMP/Clawdis-iOS.xcresult"
          DEST_ID="$(
            python3 - <<'PY'
          import json
          import subprocess
          import sys
          import uuid

          def sh(args: list[str]) -> str:
            return subprocess.check_output(args, text=True).strip()

          # Prefer an already-created iPhone simulator if it exists.
          devices = json.loads(sh(["xcrun", "simctl", "list", "devices", "-j"]))
          candidates: list[tuple[str, str]] = []
          for runtime, devs in (devices.get("devices") or {}).items():
            for dev in devs or []:
              if not dev.get("isAvailable"):
                continue
              name = str(dev.get("name") or "")
              udid = str(dev.get("udid") or "")
              if not udid or not name.startswith("iPhone"):
                continue
              candidates.append((name, udid))

          candidates.sort(key=lambda it: (0 if "iPhone 16" in it[0] else 1, it[0]))
          if candidates:
            print(candidates[0][1])
            sys.exit(0)

          # Otherwise, create one from the newest available iOS runtime.
          runtimes = json.loads(sh(["xcrun", "simctl", "list", "runtimes", "-j"])).get("runtimes") or []
          ios = [rt for rt in runtimes if rt.get("platform") == "iOS" and rt.get("isAvailable")]
          if not ios:
            print("No available iOS runtimes found.", file=sys.stderr)
            sys.exit(1)

          def version_key(rt: dict) -> tuple[int, ...]:
            parts: list[int] = []
            for p in str(rt.get("version") or "0").split("."):
              try:
                parts.append(int(p))
              except ValueError:
                parts.append(0)
            return tuple(parts)

          ios.sort(key=version_key, reverse=True)
          runtime = ios[0]
          runtime_id = str(runtime.get("identifier") or "")
          if not runtime_id:
            print("Missing iOS runtime identifier.", file=sys.stderr)
            sys.exit(1)

          supported = runtime.get("supportedDeviceTypes") or []
          iphones = [dt for dt in supported if dt.get("productFamily") == "iPhone"]
          if not iphones:
            print("No iPhone device types for iOS runtime.", file=sys.stderr)
            sys.exit(1)

          iphones.sort(
            key=lambda dt: (
              0 if "iPhone 16" in str(dt.get("name") or "") else 1,
              str(dt.get("name") or ""),
            )
          )
          device_type_id = str(iphones[0].get("identifier") or "")
          if not device_type_id:
            print("Missing iPhone device type identifier.", file=sys.stderr)
            sys.exit(1)

          sim_name = f"CI iPhone {uuid.uuid4().hex[:8]}"
          udid = sh(["xcrun", "simctl", "create", sim_name, device_type_id, runtime_id])
          if not udid:
            print("Failed to create iPhone simulator.", file=sys.stderr)
            sys.exit(1)
          print(udid)
          PY
          )"
          echo "Using iOS Simulator id: $DEST_ID"
          xcodebuild test \
            -project apps/ios/Clawdis.xcodeproj \
            -scheme Clawdis \
            -destination "platform=iOS Simulator,id=$DEST_ID" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -enableCodeCoverage YES

      - name: iOS coverage summary
        run: |
          set -euo pipefail
          RESULT_BUNDLE_PATH="$RUNNER_TEMP/Clawdis-iOS.xcresult"
          xcrun xccov view --report --only-targets "$RESULT_BUNDLE_PATH"

      - name: iOS coverage gate (43%)
        run: |
          set -euo pipefail
          RESULT_BUNDLE_PATH="$RUNNER_TEMP/Clawdis-iOS.xcresult"
          RESULT_BUNDLE_PATH="$RESULT_BUNDLE_PATH" python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          target_name = "Clawdis.app"
          minimum = 0.43

          report = json.loads(
            subprocess.check_output(
              ["xcrun", "xccov", "view", "--report", "--json", os.environ["RESULT_BUNDLE_PATH"]],
              text=True,
            )
          )

          target_coverage = None
          for target in report.get("targets", []):
            if target.get("name") == target_name:
              target_coverage = float(target["lineCoverage"])
              break

          if target_coverage is None:
            print(f"Could not find coverage for target: {target_name}")
            sys.exit(1)

          print(f"{target_name} line coverage: {target_coverage * 100:.2f}% (min {minimum * 100:.2f}%)")
          if target_coverage + 1e-12 < minimum:
            sys.exit(1)
          PY

  required-checks:
    name: "checks"
    if: always()
    needs:
      - change-scope
      - ci-contracts
      - t2-contracts
      - check
      - hosting-lifecycle
      - protected-local-fixture-artifact
      - protected-local-lifecycle
      - protected-local-rocky-lifecycle
      - protected-local-update-lifecycle
      - version-identity
      - strict-types-baseline
      - checks
      - build-artifacts
      - release-check
      - packed-core-smoke
      - signer-platform
      - ui-mining
      - ui
      - checks-windows
      - macos
      - check-docs
      - skills-python
      - secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate evaluator
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Require every applicable release gate
        env:
          DOCS_CHANGED: ${{ needs.change-scope.outputs.docs_changed }}
          VERSION_ONLY: ${{ needs.change-scope.outputs.version_only }}
          RUN_NODE: ${{ needs.change-scope.outputs.run_node }}
          RUN_SIGNER: ${{ needs.change-scope.outputs.run_signer }}
          RUN_HOSTING: ${{ needs.change-scope.outputs.run_hosting }}
          RUN_LOCAL_FRESH: ${{ needs.change-scope.outputs.run_local_fresh }}
          RUN_LOCAL_UPDATE: ${{ needs.change-scope.outputs.run_local_update }}
          RUN_CI_CONTRACTS: ${{ needs.change-scope.outputs.run_ci_contracts }}
          RUN_T2_CONTRACTS: ${{ needs.change-scope.outputs.run_t2_contracts }}
          RUN_UI_MINING: ${{ needs.change-scope.outputs.run_ui_mining }}
          RUN_SKILLS: ${{ needs.change-scope.outputs.run_skills }}
          RUN_MACOS: ${{ needs.change-scope.outputs.run_macos }}
          FULL_MATRIX: ${{ needs.change-scope.outputs.full_matrix }}
          CHANGE_SCOPE: ${{ needs.change-scope.result }}
          CHECK: ${{ needs.check.result }}
          HOSTING: ${{ needs.hosting-lifecycle.result }}
          PROTECTED_LOCAL_ARTIFACT: ${{ needs.protected-local-fixture-artifact.result }}
          PROTECTED_LOCAL: ${{ needs.protected-local-lifecycle.result }}
          PROTECTED_LOCAL_ROCKY: ${{ needs.protected-local-rocky-lifecycle.result }}
          PROTECTED_LOCAL_UPDATE: ${{ needs.protected-local-update-lifecycle.result }}
          CI_CONTRACTS: ${{ needs.ci-contracts.result }}
          T2_CONTRACTS: ${{ needs.t2-contracts.result }}
          VERSION_IDENTITY: ${{ needs.version-identity.result }}
          STRICT_TYPES: ${{ needs.strict-types-baseline.result }}
          TESTS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build-artifacts.result }}
          RELEASE: ${{ needs.release-check.result }}
          PACKED_CORE: ${{ needs.packed-core-smoke.result }}
          SIGNER: ${{ needs.signer-platform.result }}
          UI_MINING: ${{ needs.ui-mining.result }}
          UI: ${{ needs.ui.result }}
          WINDOWS: ${{ needs.checks-windows.result }}
          MACOS: ${{ needs.macos.result }}
          DOCS: ${{ needs.check-docs.result }}
          SKILLS: ${{ needs.skills-python.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: node scripts/ci-required-gates.mjs
