        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: go
          build-mode: autobuild

      - name: Autobuild Go
        uses: github/codeql-action/autobuild@d1ba80a13dd99fba24a470575428917156a28b43 # v4

      - name: Analyze Go
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          category: /language:go

  codeql-python:
    name: "CodeQL Python"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_codeql_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: python
          build-mode: none

      - name: Analyze Python
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          category: /language:python

  version-identity:
    name: "version identity"
    needs: [change-scope]
    if: needs.change-scope.outputs.version_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Validate exact version-only diff
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-version-identity.mjs

  strict-types-baseline:
    name: "strict types baseline"
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.run_node == 'true' &&
      needs.change-scope.outputs.focused_local_update != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Reject new repository-wide TypeScript errors
        run: pnpm check:typescript:baseline

  ui-mining:
    name: "ui-mining"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_ui_mining == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Install Playwright Chromium for mining browser tests
        run: pnpm --dir ui exec playwright install chromium

      - name: Run Control UI mining browser tests
        run: pnpm test:ui:mining

      - name: Upload mining UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-mining-screenshots-${{ github.run_id }}
          if-no-files-found: ignore
          path: ui/src/ui/**/__screenshots__/

  ui:
    name: "Control UI"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Install Playwright Chromium for changed browser tests
        if: needs.change-scope.outputs.changed_ui_browser_tests == 'true'
        run: pnpm --dir ui exec playwright install chromium

      - name: Run exact changed Control UI tests
        if: needs.change-scope.outputs.test_only == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.change-scope.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs ui

      - name: Install Playwright Chromium for Control UI suite
        if: needs.change-scope.outputs.test_only != 'true'
        run: pnpm --dir ui exec playwright install chromium

      - name: Build Control UI
        if: needs.change-scope.outputs.test_only != 'true'
        run: pnpm ui:build

      - name: Run Control UI Node tests
        if: needs.change-scope.outputs.test_only != 'true'
        run: pnpm --dir ui test:node

      - name: Run Control UI browser tests
        if: needs.change-scope.outputs.test_only != 'true'
        run: pnpm test:ui

      - name: Upload full UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots-${{ github.run_id }}
          if-no-files-found: ignore
          path: ui/src/**/__screenshots__/

  # Report-only dead-code scans. Runs after scope detection and stores machine-readable
  # results as artifacts for later triage before we enable hard gates.
  # Temporarily disabled in CI while we process initial findings.
  deadcode:
    name: dead-code report
    needs: [change-scope]
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: knip
            command: pnpm deadcode:report:ci:knip
          - tool: ts-prune
            command: pnpm deadcode:report:ci:ts-prune
          - tool: ts-unused-exports
            command: pnpm deadcode:report:ci:ts-unused
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run ${{ matrix.tool }} dead-code scan
        run: ${{ matrix.command }}

      - name: Upload dead-code results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dead-code-${{ matrix.tool }}-${{ github.run_id }}
          path: .artifacts/deadcode

  # Validate docs (format, lint, broken links) only when docs files changed.
  check-docs:
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.docs_changed == 'true' &&
      needs.change-scope.outputs.version_only != 'true' &&
      needs.change-scope.outputs.focused_local_update != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check docs
        run: pnpm check:docs

  skills-python:
    needs: [change-scope]
    if: needs.change-scope.outputs.run_skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pyyaml

      - name: Lint Python skill scripts
        run: python -m ruff check skills

      - name: Test skill Python scripts
        run: python -m pytest -q skills

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Resolve changed-file audit base
        id: audit-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" = "push" ]]; then
            base="$PUSH_BEFORE"
          else
            base="$PR_BASE_SHA"
          fi
          if [[ ! "$base" =~ ^[a-f0-9]{40}$ ]] || [[ "$base" = "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Detect secrets
        run: pre-commit run detect-secrets --from-ref "${{ steps.audit-base.outputs.base }}" --to-ref HEAD

      - name: Detect committed private keys
        run: pre-commit run detect-private-key --from-ref "${{ steps.audit-base.outputs.base }}" --to-ref HEAD

      - name: Audit changed GitHub workflows with zizmor
        env:
          BASE: ${{ steps.audit-base.outputs.base }}
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(git diff --name-only "$BASE" HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "No workflow changes detected; skipping zizmor."
            exit 0
          fi

          pre-commit run zizmor --files "${workflow_files[@]}"

  # Native Windows is not a supported Fased runtime. Windows users run the
  # Linux product through WSL2, whose contracts execute in Linux lanes.
  macos-runtime:
    name: "macOS runtime"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_macos_runtime == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run affected Darwin and launchd contracts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm exec vitest run
          scripts/install-platform-preflight.test.ts
          scripts/install-release-pin.test.ts
          src/daemon/launchd.test.ts
          src/daemon/runtime-paths.test.ts
          src/commands/doctor-platform-notes.launchctl-env-overrides.test.ts
          --pool=forks
          --maxWorkers=1

  macos-app:
    name: "macOS app"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_macos_app == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version

      - name: Install Swift lint tools
        run: brew install swiftlint swiftformat

      - name: Swift lint
        run: |
          swiftlint --config .swiftlint.yml
          swiftformat --lint apps/macos/Sources --config .swiftformat
          swiftformat --lint apps/shared/FasedAgentKit/Sources --config .swiftformat
          swiftformat --lint Swabble/Sources --config .swiftformat

      - name: Cache SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('apps/macos/Package.resolved', 'Swabble/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Swift build and test
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --configuration release
          swift test --package-path apps/macos
          swift test --package-path apps/shared/FasedAgentKit
          swift test --package-path Swabble

  required-checks:
    name: "checks"
    if: always()
    needs:
      - change-scope
      - ci-contracts
      - t2-contracts
      - node-focused
      - node-unit
      - node-gateway
      - node-extensions
      - dependency-integrity
      - check
      - hosting-lifecycle
      - protected-local-fixture-artifact
      - protected-local-lifecycle
      - protected-local-rocky-lifecycle
      - protected-local-update-lifecycle
      - version-identity
      - strict-types-baseline
      - checks
      - build-artifacts
      - release-check
      - packed-core-smoke
      - signer-platform
      - signer-integration
      - signer-darwin-integration
      - platform-bootstrap-audit
      - docker-amd64
      - docker-arm64
      - codeql-javascript
      - codeql-go
      - codeql-python
      - ui-mining
      - ui
      - macos-runtime
      - macos-app
      - check-docs
      - skills-python
      - secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate evaluator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Require every applicable release gate
        env:
          DOCS_CHANGED: ${{ needs.change-scope.outputs.docs_changed }}
          FOCUSED_LOCAL_UPDATE: ${{ needs.change-scope.outputs.focused_local_update }}
          VERSION_ONLY: ${{ needs.change-scope.outputs.version_only }}
          MANUAL_REVIEW_REQUIRED: ${{ needs.change-scope.outputs.manual_review_required }}
          RUN_NODE_FOCUSED: ${{ needs.change-scope.outputs.run_node_focused }}
          RUN_NODE_UNIT: ${{ needs.change-scope.outputs.run_node_unit }}
          RUN_NODE_GATEWAY: ${{ needs.change-scope.outputs.run_node_gateway }}
          RUN_NODE_EXTENSIONS: ${{ needs.change-scope.outputs.run_node_extensions }}
          RUN_DEPENDENCY_INTEGRITY: ${{ needs.change-scope.outputs.run_dependency_integrity }}
          RUN_NODE_BUILD: ${{ needs.change-scope.outputs.run_node_build }}
          RUN_NODE_PACKAGING: ${{ needs.change-scope.outputs.run_node_packaging }}
          RUN_NODE_FULL: ${{ needs.change-scope.outputs.run_node_full }}
          RUN_NATIVE_SIGNER: ${{ needs.change-scope.outputs.run_native_signer }}
          RUN_SIGNER_INTEGRATION: ${{ needs.change-scope.outputs.run_signer_integration }}
          RUN_SIGNER_DARWIN_INTEGRATION: ${{ needs.change-scope.outputs.run_signer_darwin_integration }}
          RUN_PLATFORM_BOOTSTRAP: ${{ needs.change-scope.outputs.run_platform_bootstrap }}
          RUN_DOCKER: ${{ needs.change-scope.outputs.run_docker }}
          RUN_CODEQL_JAVASCRIPT: ${{ needs.change-scope.outputs.run_codeql_javascript }}
          RUN_CODEQL_GO: ${{ needs.change-scope.outputs.run_codeql_go }}
          RUN_CODEQL_PYTHON: ${{ needs.change-scope.outputs.run_codeql_python }}
          RUN_HOSTING: ${{ needs.change-scope.outputs.run_hosting }}
          RUN_LOCAL_FRESH: ${{ needs.change-scope.outputs.run_local_fresh }}
          RUN_LOCAL_UPDATE: ${{ needs.change-scope.outputs.run_local_update }}
          RUN_CI_CONTRACTS: ${{ needs.change-scope.outputs.run_ci_contracts }}
          RUN_T2_CONTRACTS: ${{ needs.change-scope.outputs.run_t2_contracts }}
          RUN_UI_MINING: ${{ needs.change-scope.outputs.run_ui_mining }}
          RUN_UI: ${{ needs.change-scope.outputs.run_ui }}
          RUN_SKILLS: ${{ needs.change-scope.outputs.run_skills }}
          RUN_MACOS_RUNTIME: ${{ needs.change-scope.outputs.run_macos_runtime }}
          RUN_MACOS_APP: ${{ needs.change-scope.outputs.run_macos_app }}
          FULL_MATRIX: ${{ needs.change-scope.outputs.full_matrix }}
          CHANGE_SCOPE: ${{ needs.change-scope.result }}
          CHECK: ${{ needs.check.result }}
          HOSTING: ${{ needs.hosting-lifecycle.result }}
          PROTECTED_LOCAL_ARTIFACT: ${{ needs.protected-local-fixture-artifact.result }}
          PROTECTED_LOCAL: ${{ needs.protected-local-lifecycle.result }}
          PROTECTED_LOCAL_ROCKY: ${{ needs.protected-local-rocky-lifecycle.result }}
          PROTECTED_LOCAL_UPDATE: ${{ needs.protected-local-update-lifecycle.result }}
          CI_CONTRACTS: ${{ needs.ci-contracts.result }}
          T2_CONTRACTS: ${{ needs.t2-contracts.result }}
          VERSION_IDENTITY: ${{ needs.version-identity.result }}
          STRICT_TYPES: ${{ needs.strict-types-baseline.result }}
          FOCUSED_TESTS: ${{ needs.node-focused.result }}
          NODE_UNIT_TESTS: ${{ needs.node-unit.result }}
          NODE_GATEWAY_TESTS: ${{ needs.node-gateway.result }}
          NODE_EXTENSION_TESTS: ${{ needs.node-extensions.result }}
          DEPENDENCY_INTEGRITY: ${{ needs.dependency-integrity.result }}
          TESTS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build-artifacts.result }}
          RELEASE: ${{ needs.release-check.result }}
          PACKED_CORE: ${{ needs.packed-core-smoke.result }}
          SIGNER: ${{ needs.signer-platform.result }}
          SIGNER_INTEGRATION: ${{ needs.signer-integration.result }}
          SIGNER_DARWIN_INTEGRATION: ${{ needs.signer-darwin-integration.result }}
          PLATFORM_BOOTSTRAP: ${{ needs.platform-bootstrap-audit.result }}
          DOCKER_AMD64: ${{ needs.docker-amd64.result }}
          DOCKER_ARM64: ${{ needs.docker-arm64.result }}
          CODEQL_JAVASCRIPT: ${{ needs.codeql-javascript.result }}
          CODEQL_GO: ${{ needs.codeql-go.result }}
          CODEQL_PYTHON: ${{ needs.codeql-python.result }}
          UI_MINING: ${{ needs.ui-mining.result }}
          UI: ${{ needs.ui.result }}
          MACOS_RUNTIME: ${{ needs.macos-runtime.result }}
          MACOS_APP: ${{ needs.macos-app.result }}
          DOCS: ${{ needs.check-docs.result }}
          SKILLS: ${{ needs.skills-python.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: node scripts/ci-required-gates.mjs
