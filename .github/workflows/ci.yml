name: Weekly Diagnostics

on:
  schedule:
    - cron: "19 7 * * 0"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run every supported CI lane regardless of changed paths
        required: true
        default: true
        type: boolean
      archive_branch_proof:
        description: Run only the unpublished candidate generation archive branch proof
        required: true
        default: false
        type: boolean
      archive_proof_source_commit:
        description: Exact branch commit to prove
        required: false
        type: string
      archive_proof_base_commit:
        description: Exact protected-main base authorized for the source fix
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # This owner-dispatched lane proves the real candidate generation archive
  # producer on the same Ubuntu runner path without fabricating other platforms,
  # allocating a candidate, or uploading candidate bytes.
  archive-branch-proof:
    name: "candidate generation archive branch proof"
    if: github.event_name == 'workflow_dispatch' && inputs.archive_branch_proof == true
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact archive source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.archive_proof_source_commit }}
          fetch-depth: 0
          submodules: false

      - name: Bind proof to exact protected-main source
        env:
          AUTHORIZED_BASE_COMMIT: ${{ inputs.archive_proof_base_commit }}
          SOURCE_COMMIT: ${{ inputs.archive_proof_source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          commit_pattern='^[0-9a-f]{40}$'
          [[ "$SOURCE_COMMIT" =~ $commit_pattern ]]
          [[ "$AUTHORIZED_BASE_COMMIT" =~ $commit_pattern ]]
          test "$GITHUB_REF" != "refs/heads/main"
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$AUTHORIZED_BASE_COMMIT"
          git merge-base --is-ancestor "$AUTHORIZED_BASE_COMMIT" "$SOURCE_COMMIT"

          test -x scripts/build-linux-x64-release-artifact.sh
          test -n "$(git diff --name-only "$AUTHORIZED_BASE_COMMIT" "$SOURCE_COMMIT")"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-lifecycled/go.mod
          cache-dependency-path: |
            tools/fased-lifecycled/go.sum
            tools/fased-signerd/go.sum

      - name: Prove manifest and progress contracts
        run: pnpm exec vitest run scripts/release-archive.test.ts

      - name: Build exact candidate generation archive once
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-linux-x64-release-artifact.sh \
            "$RUNNER_TEMP/fased-archive-branch-proof" 2>&1 |
            tee "$RUNNER_TEMP/fased-archive-branch-proof.log"

      - name: Verify exact candidate generation archive inventory
        env:
          AUTHORIZED_BASE_COMMIT: ${{ inputs.archive_proof_base_commit }}
          SOURCE_COMMIT: ${{ inputs.archive_proof_source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/fased-archive-branch-proof"
          descriptor="$candidate/fased-hosting-candidate.json"
          proof="$candidate/fased-branch-proof-x64.json"
          build_log="$RUNNER_TEMP/fased-archive-branch-proof.log"
          evidence_dir="$RUNNER_TEMP/fased-archive-branch-proof-evidence"
          version="$(node -p 'require("./package.json").version')"
          source_tree="$(git rev-parse "$SOURCE_COMMIT^{tree}")"
          lockfile_digest="sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')"

          test -f "$descriptor"
          test ! -L "$descriptor"
          test -f "$proof"
          test ! -L "$proof"
          test -s "$build_log"
          jq -e '.profile == "linux-x64" and .publishable == false' "$proof" >/dev/null
          node scripts/release-artifact-set.mjs verify \
            --directory "$candidate" \
            --version "$version" \
            --commit "$SOURCE_COMMIT" \
            --tree "$source_tree" \
            --lockfile-digest "$lockfile_digest" \
            --source-ref "refs/tags/v$version" \
            --workflow-run-id "$GITHUB_RUN_ID" >/dev/null

          artifact_count="$(jq -er '.artifacts | length' "$descriptor")"
          test "$artifact_count" -gt 0
          test "$artifact_count" -le 96
          artifact_bytes="$(jq -er '[.artifacts[].size] | add' "$descriptor")"
          test "$artifact_bytes" -gt 0
          test "$artifact_bytes" -le 805306368
          max_archive_bytes="$({
            jq -r '.artifacts[] | select(.name | endswith(".tar.gz")) | .size' "$descriptor"
          } | sort -nr | head -n 1)"
          test -n "$max_archive_bytes"
          test "$max_archive_bytes" -gt 0

          mapfile -t archive_receipts < <(
            sed -n 's/^release-archive: completionReceipt=//p' "$build_log"
          )
          test "${#archive_receipts[@]}" -eq 2
          printf '%s\n' "${archive_receipts[@]}" | jq -s -e \
            'all(.[];
              .schemaVersion == 1 and
              .manifestEntries == .archivedEntries and
              .rawBytes > 0 and .compressedBytes > 0)' >/dev/null
          max_raw_archive_bytes="$({
            printf '%s\n' "${archive_receipts[@]}" | jq -r '.rawBytes'
          } | sort -nr | head -n 1)"
          test "$max_raw_archive_bytes" -gt 0

          mkdir -p "$evidence_dir"
          jq -n \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$source_tree" \
            --arg authorizedBaseCommit "$AUTHORIZED_BASE_COMMIT" \
            --arg lockfileDigest "$lockfile_digest" \
            --arg descriptorSha256 "sha256:$(sha256sum "$descriptor" | awk '{print $1}')" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson artifactCount "$artifact_count" \
            --argjson artifactBytes "$artifact_bytes" \
            --argjson archiveCompletionCount "${#archive_receipts[@]}" \
            --argjson maxArchiveBytes "$max_archive_bytes" \
            --argjson maxRawArchiveBytes "$max_raw_archive_bytes" \
            '{
              schemaVersion: 1,
              proof: "manifest-driven-candidate-generation-archive",
              environment: "github-ubuntu-24.04",
              sourceCommit: $sourceCommit,
              sourceTree: $sourceTree,
              authorizedBaseCommit: $authorizedBaseCommit,
              lockfileDigest: $lockfileDigest,
              descriptorSha256: $descriptorSha256,
              artifactCount: $artifactCount,
              artifactBytes: $artifactBytes,
              archiveCompletionCount: $archiveCompletionCount,
              maxArchiveBytes: $maxArchiveBytes,
              maxRawArchiveBytes: $maxRawArchiveBytes,
              workflowRunId: $workflowRunId,
              workflowRunAttempt: $workflowRunAttempt,
              archiveContractTests: "scripts/release-archive.test.ts"
            }' >"$evidence_dir/evidence.json"

      - name: Upload archive proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fased-archive-branch-proof-evidence
          path: ${{ runner.temp }}/fased-archive-branch-proof-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove unpublished branch proof bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- \
            "$RUNNER_TEMP/fased-archive-branch-proof" \
            "$RUNNER_TEMP/fased-archive-branch-proof.log" \
            "$RUNNER_TEMP/fased-archive-branch-proof-evidence"

  # Resolve one authoritative changed-surface plan for PRs and main pushes.
  # Manual runs and failed/empty diffs fail safe to the complete supported matrix.
  change-scope:
    if: github.event_name != 'workflow_dispatch' || inputs.archive_branch_proof != true
    runs-on: ubuntu-latest
    outputs:
      authority_version: ${{ steps.scope.outputs.authority_version }}
      plan_digest: ${{ steps.scope.outputs.plan_digest }}
      gate_plan_json: ${{ steps.scope.outputs.gate_plan_json }}
      changed_test_paths_json: ${{ steps.scope.outputs.changed_test_paths_json }}
      changed_ui_browser_tests: ${{ steps.scope.outputs.changed_ui_browser_tests }}
      phase: ${{ steps.scope.outputs.phase }}
      entry_points_json: ${{ steps.scope.outputs.entry_points_json }}
      change_kind: ${{ steps.scope.outputs.change_kind }}
      manual_review_required: ${{ steps.scope.outputs.manual_review_required }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      docs_changed: ${{ steps.scope.outputs.docs_changed }}
      version_only: ${{ steps.scope.outputs.version_only }}
      ci_infrastructure_only: ${{ steps.scope.outputs.ci_infrastructure_only }}
      test_only: ${{ steps.scope.outputs.test_only }}
      fixture_only: ${{ steps.scope.outputs.fixture_only }}
      production_changed: ${{ steps.scope.outputs.production_changed }}
      privilege_changed: ${{ steps.scope.outputs.privilege_changed }}
      reuse_pr_checks: ${{ steps.scope.outputs.reuse_pr_checks }}
      run_node: ${{ steps.scope.outputs.run_node }}
      dependency_remediation: ${{ steps.scope.outputs.dependency_remediation }}
      focused_local_update: ${{ steps.scope.outputs.focused_local_update }}
      run_dependency_integrity: ${{ steps.scope.outputs.run_dependency_integrity }}
      run_node_focused: ${{ steps.scope.outputs.run_node_focused }}
      run_node_build: ${{ steps.scope.outputs.run_node_build }}
      run_node_packaging: ${{ steps.scope.outputs.run_node_packaging }}
      run_node_full: ${{ steps.scope.outputs.run_node_full }}
      run_node_unit: ${{ steps.scope.outputs.run_node_unit }}
      run_node_gateway: ${{ steps.scope.outputs.run_node_gateway }}
      run_node_extensions: ${{ steps.scope.outputs.run_node_extensions }}
      run_ui: ${{ steps.scope.outputs.run_ui }}
      run_macos_runtime: ${{ steps.scope.outputs.run_macos_runtime }}
      run_macos_app: ${{ steps.scope.outputs.run_macos_app }}
      run_native_signer: ${{ steps.scope.outputs.run_native_signer }}
      run_signer_integration: ${{ steps.scope.outputs.run_signer_integration }}
      run_signer_darwin_integration: ${{ steps.scope.outputs.run_signer_darwin_integration }}
      run_docker: ${{ steps.scope.outputs.run_docker }}
      run_codeql_javascript: ${{ steps.scope.outputs.run_codeql_javascript }}
      focused_codeql_javascript: ${{ steps.scope.outputs.focused_codeql_javascript }}
      run_codeql_go: ${{ steps.scope.outputs.run_codeql_go }}
      run_codeql_python: ${{ steps.scope.outputs.run_codeql_python }}
      run_hosting: ${{ steps.scope.outputs.run_hosting }}
      run_ci_contracts: ${{ steps.scope.outputs.run_ci_contracts }}
      run_t2_contracts: ${{ steps.scope.outputs.run_t2_contracts }}
      run_ui_mining: ${{ steps.scope.outputs.run_ui_mining }}
      run_skills: ${{ steps.scope.outputs.run_skills }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout trusted authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .ci-authority
          fetch-depth: 1
          submodules: false

      - name: Detect changed scopes
        id: scope
        env:
          FULL_MATRIX: ${{ github.event_name == 'schedule' || inputs.full_matrix == true }}
          REUSE_PR_CHECKS: "false"
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .ci-authority/scripts/ci-change-scope.mjs

  # CI routing is executable product policy. Validate it without rebuilding or
  # launching product fixtures when only that policy changes.
  ci-contracts:
    name: "CI routing contracts"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_ci_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check CI authority formatting and lint
        run: |
          pnpm exec oxfmt --check \
            .github/actions/setup-node-env/action.yml \
            .github/actions/setup-pnpm-store-cache/action.yml \
            .github/actions/setup-trivy-cache/action.yml \
            .github/workflows/ci.yml \
            .github/workflows/main.yml \
            .github/workflows/docker-release.yml \
            .github/workflows/formal-conformance.yml \
            .github/workflows/hosted-runtime-release.yml \
            .github/workflows/provider-catalog-refresh.yml \
            .github/workflows/sandbox-common-smoke.yml \
            .github/workflows/stale.yml \
            .github/workflows/workflow-sanity.yml \
            config/lifecycle-compatibility.v1.json \
            scripts/lifecycle-compatibility-inventory.mjs \
            scripts/lifecycle-compatibility-inventory.test.ts \
            scripts/ci-change-scope.mjs \
            scripts/ci-change-scope.test.ts \
            scripts/ci-run-changed-tests.mjs \
            scripts/ci-run-changed-tests.test.ts \
            scripts/ci-required-gates.mjs \
            scripts/ci-required-gates.test.ts \
            scripts/ci-workflow-contract.test.ts \
            scripts/lifecycle-channel-advance.mjs \
            scripts/lifecycle-channel-advance.test.ts \
            scripts/lifecycle-version-neutral.test.ts \
            ui/vitest.changed-node.config.ts
          pnpm exec oxlint \
            scripts/lifecycle-compatibility-inventory.mjs \
            scripts/lifecycle-compatibility-inventory.test.ts \
            scripts/ci-change-scope.mjs \
            scripts/ci-change-scope.test.ts \
            scripts/ci-run-changed-tests.mjs \
            scripts/ci-run-changed-tests.test.ts \
            scripts/ci-required-gates.mjs \
            scripts/ci-required-gates.test.ts \
            scripts/ci-workflow-contract.test.ts \
            scripts/lifecycle-version-neutral.test.ts \
            ui/vitest.changed-node.config.ts

      - name: Check CI routing and gate contracts
        run: >-
          pnpm exec vitest run
          scripts/lifecycle-compatibility-inventory.test.ts
          scripts/ci-change-scope.test.ts
          scripts/ci-run-changed-tests.test.ts
          scripts/ci-required-gates.test.ts
          scripts/ci-merged-main-reuse.test.ts
          scripts/ci-version-identity.test.ts
          scripts/ci-workflow-contract.test.ts
          scripts/lifecycle-channel-advance.test.ts
          scripts/lifecycle-version-neutral.test.ts

      - name: Check version-neutral lifecycle compatibility evidence
        run: node scripts/lifecycle-compatibility-inventory.mjs --verify-git

      - name: Check workflow semantics
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.11"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " $archive\$" "$RUNNER_TEMP/checksums.txt" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          python3 scripts/check-composite-action-input-interpolation.py

  # T2 harness-only edits prove their own source contracts without rebuilding
  # Fased or launching fresh Local/Hosting fixtures. This is SUPPORTING evidence;
  # the authoritative same-host generated-unit transaction remains a local T2 gate.
  t2-contracts:
    name: "T2 harness contracts"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_t2_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-lifecycled/go.mod
          cache-dependency-path: tools/fased-lifecycled/go.sum

      - name: Run lifecycle transaction contracts
        run: go -C tools/fased-lifecycled test ./platform ./engine ./store ./daemon ./controller

  # The trusted lifecycle route selects this bounded Local-update lane. Keep
  # commands allowlisted in workflow source; never execute commands supplied by
  # a PR label, manifest, or status description.
  node-focused:
    name: "focused Node tests"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_focused == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false
          fetch-tags: true

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check focused Local-update source
        run: |
          pnpm exec oxfmt --check \
            config/lifecycle-compatibility.v1.json \
            docs/reference/ci.md \
            package.json \
            scripts/ci-change-scope.mjs \
            scripts/ci-change-scope.test.ts \
            scripts/go-lifecycle-routing.test.ts \
            scripts/npm-free-managed-lifecycle-contract.test.ts \
            scripts/release-check.ts
          pnpm exec oxlint \
            scripts/ci-change-scope.mjs \
            scripts/ci-change-scope.test.ts \
            scripts/go-lifecycle-routing.test.ts \
            scripts/npm-free-managed-lifecycle-contract.test.ts \
            scripts/release-check.ts

      - name: Run focused Local-update regressions
        run: >-
          pnpm exec vitest run
          scripts/go-lifecycle-routing.test.ts
          scripts/npm-free-managed-lifecycle-contract.test.ts
          src/wallet/wallet-application-state-permissions.test.ts
          --pool=forks
          --maxWorkers=1

  node-unit:
    name: "Node unit tests"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run unit tests
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.change-scope.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs unit

  node-gateway:
    name: "Node Gateway tests"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run exact changed Gateway tests
        if: needs.change-scope.outputs.test_only == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.change-scope.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs gateway

      - name: Run Gateway subsystem tests
        if: needs.change-scope.outputs.test_only != 'true'
        run: >-
          pnpm canvas:a2ui:bundle &&
          pnpm exec vitest run
          --config vitest.gateway.config.ts
          --pool=forks
          --maxWorkers=2

  node-extensions:
    name: "Node extension tests"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run exact changed extension tests
        if: needs.change-scope.outputs.test_only == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.change-scope.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs extensions

      - name: Run extension subsystem tests
        if: needs.change-scope.outputs.test_only != 'true'
        run: >-
          pnpm canvas:a2ui:bundle &&
          pnpm exec vitest run
          --config vitest.extensions.config.ts
          --pool=forks
          --maxWorkers=2

  dependency-integrity:
    name: "dependency integrity"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_dependency_integrity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-key-suffix: "dependency-integrity-node22"

      - name: Prove exact override-only remediation
        if: needs.change-scope.outputs.dependency_remediation == 'true'
        env:
          DEPENDENCY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-dependency-integrity.mjs

      - name: Verify frozen lockfile
        run: pnpm install --lockfile-only --ignore-scripts --frozen-lockfile --prefer-offline

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # Build dist once for Node-relevant changes and share it with downstream jobs.
  build-artifacts:
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.run_node_build == 'true' ||
      needs.change-scope.outputs.run_hosting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build dist
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  # Validate packaged runtime contents after build before merge and again on main.
  release-check:
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_node_packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-build
          path: dist/

      - name: Check release contents
        run: pnpm release:validate-dist:contracts

  # Keep the real packed fresh-install smoke independent of the contract suite.
  # Both consume the exact same built dist, so this shortens the release gate
  # without rebuilding or dropping either validation path.
  packed-core-smoke:
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_node_packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-build
          path: dist/

      - name: Run packed fresh-install smoke
        run: pnpm release:validate-dist:packed

  signer-platform:
    name: Native signer (${{ matrix.name }})
    needs: [change-scope]
    if: needs.change-scope.outputs.run_native_signer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Test native signer
        working-directory: tools/fased-signerd
        run: go test ./...

      - name: Build native signer for the runner
        working-directory: tools/fased-signerd
        run: go build -buildvcs=false -trimpath -o "${RUNNER_TEMP}/fased-signerd" .

      - name: Cross-compile every supported signer target
        if: runner.os == 'Linux'
        run: bash scripts/test-fased-signerd-portable-builds.sh

  signer-integration:
    name: "signer integration"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_signer_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Test JavaScript signer lifecycle integration
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm vitest run
          scripts/install-platform-preflight.test.ts
          scripts/install-release-pin.test.ts
          src/wallet/providers/local-socket-signer-adapter.integration.test.ts
          src/wizard/onboarding.wallet.test.ts
          --pool=forks
          --maxWorkers=1

  signer-darwin-integration:
    name: "Darwin signer integration"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_signer_darwin_integration == 'true'
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/fased-signerd/go.mod
          cache-dependency-path: tools/fased-signerd/go.sum

      - name: Test Darwin signer lifecycle integration
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm vitest run
          scripts/install-platform-preflight.test.ts
          scripts/install-release-pin.test.ts
          src/wallet/providers/local-socket-signer-adapter.integration.test.ts
          src/wizard/onboarding.wallet.test.ts
          --pool=forks
          --maxWorkers=1

  checks:
    name: "test (${{ matrix.runtime }}, ${{ matrix.task }})"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_node_full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            task: unit-1of2
            test_lane: true
            groups: unit-fast
            shard_index: 1
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: unit-2of2
            test_lane: true
            groups: unit-fast
            shard_index: 2
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: support-isolated
            test_lane: true
            groups: unit-isolated
            shard_index: 0
            shard_count: 1
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-1of4
            test_lane: true
            groups: extensions
            shard_index: 1
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-2of4
            test_lane: true
            groups: extensions
            shard_index: 2
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-3of4
            test_lane: true
            groups: extensions
            shard_index: 3
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: extensions-4of4
            test_lane: true
            groups: extensions
            shard_index: 4
            shard_count: 4
            profile: serial
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: gateway-1of2
            test_lane: true
            groups: gateway
            shard_index: 1
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: gateway-2of2
            test_lane: true
            groups: gateway
            shard_index: 2
            shard_count: 2
            profile: normal
            command: pnpm canvas:a2ui:bundle && pnpm test
          - runtime: node
            task: protocol
            test_lane: false
            command: pnpm protocol:check
          - runtime: bun
            task: test
            test_lane: false
            command: pnpm canvas:a2ui:bundle && bunx vitest run --config vitest.unit.config.ts
    steps:
      - name: Skip Bun outside the manual full matrix
        if: matrix.runtime == 'bun' && needs.change-scope.outputs.full_matrix != 'true'
        run: echo "Skipping the optional Bun compatibility lane."

      - name: Checkout
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "${{ matrix.runtime == 'bun' }}"

      - name: Configure vitest JSON reports
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: echo "FASED_VITEST_REPORT_DIR=$RUNNER_TEMP/vitest-reports" >> "$GITHUB_ENV"

      - name: Configure Node test resources
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: |
          # Split measured long-running groups onto independent runners.
          # Each matrix entry declares its shard count; suites remain serial
          # internally where deterministic process state is required.
          echo "FASED_TEST_GROUPS=${{ matrix.groups }}" >> "$GITHUB_ENV"
          echo "FASED_TEST_PROFILE=${{ matrix.profile }}" >> "$GITHUB_ENV"
          echo "FASED_TEST_WORKERS=2" >> "$GITHUB_ENV"
          echo "FASED_TEST_EXTENSIONS_WORKERS=1" >> "$GITHUB_ENV"
          echo "FASED_TEST_MAX_OLD_SPACE_SIZE_MB=4096" >> "$GITHUB_ENV"
          if [ "${{ matrix.shard_count }}" -gt 1 ]; then
            echo "FASED_TEST_SHARDS=${{ matrix.shard_count }}" >> "$GITHUB_ENV"
            echo "FASED_TEST_SHARD_INDEX=${{ matrix.shard_index }}" >> "$GITHUB_ENV"
          fi

      - name: Run ${{ matrix.task }} (${{ matrix.runtime }})
        if: matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true'
        run: ${{ matrix.command }}

      - name: Summarize slowest tests
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        run: |
          node scripts/vitest-slowest.mjs --dir "$FASED_VITEST_REPORT_DIR" --top 50 --out "$RUNNER_TEMP/vitest-slowest.md" > /dev/null
          echo "Slowest test summary written to $RUNNER_TEMP/vitest-slowest.md"

      - name: Upload vitest reports
        if: (matrix.runtime != 'bun' || needs.change-scope.outputs.full_matrix == 'true') && matrix.test_lane == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-reports-${{ runner.os }}-${{ matrix.runtime }}-${{ matrix.task }}
          path: |
            ${{ env.FASED_VITEST_REPORT_DIR }}
            ${{ runner.temp }}/vitest-slowest.md

  # Public gate: format, lint, and policy checks. Repository-wide TypeScript debt
  # is enforced separately as a blocking no-new-errors baseline.
  check:
    name: "check"
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.run_node == 'true' &&
      needs.change-scope.outputs.run_node_focused != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check format and lint
        run: pnpm check:ci

      - name: Enforce safe external URL opening policy
        run: pnpm lint:ui:no-raw-window-open

  hosting-lifecycle:
    name: "hosting lifecycle"
    needs: [change-scope, build-artifacts]
    if: needs.change-scope.outputs.run_hosting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Download exact dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-build
          path: dist/

      - name: Check streamed Hosting handoff contracts
        run: >-
          pnpm exec vitest run
          scripts/install-release-pin.test.ts
          scripts/go-lifecycle-routing.test.ts
          --pool=forks --maxWorkers=1

  docker-amd64:
    name: "Docker amd64"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node test environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Test Docker setup and coordinated backup/rollback
        run: >-
          pnpm exec vitest run
          src/docker-setup.test.ts
          scripts/docker-signer-update.backup.test.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          tags: fased-local-ci:${{ github.sha }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=fased-pr-amd64
          cache-to: type=gha,scope=fased-pr-amd64,mode=max

      - name: Verify non-root runtime user
        env:
          IMAGE: fased-local-ci:${{ github.sha }}
        run: test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "node"

      - name: Verify native signer is packaged
        env:
          IMAGE: fased-local-ci:${{ github.sha }}
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(docker run --rm --entrypoint /usr/local/bin/fased-signerd "$IMAGE" --version)"
          test "$actual" = "fased-signerd ${expected} commit=unknown buildInputDigest=unknown development=true"

      - name: Setup Trivy cache
        uses: ./.github/actions/setup-trivy-cache

      - name: Scan local validation image
        env:
          IMAGE: fased-local-ci:${{ github.sha }}
        run: scripts/scan-docker-image.sh "$IMAGE" linux/amd64

  docker-arm64:
    name: "Docker arm64"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_docker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build native ARM64 signer export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: signer-artifact
          platforms: linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/fased-signer-arm64
          cache-from: type=gha,scope=fased-pr-signer-arm64
          cache-to: type=gha,scope=fased-pr-signer-arm64,mode=max

      - name: Execute container-built ARM64 signer
        shell: bash
        run: |
          set -euo pipefail
          signer="${RUNNER_TEMP}/fased-signer-arm64/fased-signerd"
          chmod 0555 "$signer"
          expected="$(node -p "require('./package.json').version")"
          actual="$("$signer" --version)"
          test "$actual" = "fased-signerd ${expected} commit=unknown buildInputDigest=unknown development=true"

  codeql-javascript:
    name: "CodeQL JavaScript"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_codeql_javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize focused CodeQL
        if: needs.change-scope.outputs.focused_codeql_javascript == 'true'
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            name: "Focused Node"
            paths:
              - scripts
              - src/commands/wallet.ts
              - src/federation/federation-state-permissions.ts
              - src/wallet/wallet-runtime-config.ts

      - name: Initialize full CodeQL
        if: needs.change-scope.outputs.focused_codeql_javascript != 'true'
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          category: /language:javascript-typescript

  codeql-go:
    name: "CodeQL Go"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_codeql_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: go
          build-mode: autobuild

      - name: Autobuild Go
        uses: github/codeql-action/autobuild@d1ba80a13dd99fba24a470575428917156a28b43 # v4

      - name: Analyze Go
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          category: /language:go

  codeql-python:
    name: "CodeQL Python"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_codeql_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: python
          build-mode: none

      - name: Analyze Python
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          category: /language:python

  version-identity:
    name: "version identity"
    needs: [change-scope]
    if: needs.change-scope.outputs.version_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Validate exact version-only diff
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-version-identity.mjs --allow-obsolete-tagged-candidate-restore

  strict-types-baseline:
    name: "strict types baseline"
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.run_node == 'true' &&
      needs.change-scope.outputs.run_node_focused != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Reject new repository-wide TypeScript errors
        run: pnpm check:typescript:baseline

  ui-mining:
    name: "ui-mining"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_ui_mining == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Install Playwright Chromium for mining browser tests
        run: pnpm --dir ui exec playwright install chromium

      - name: Run Control UI mining browser tests
        run: pnpm test:ui:mining

      - name: Upload mining UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-mining-screenshots-${{ github.run_id }}
          if-no-files-found: ignore
          path: ui/src/ui/**/__screenshots__/

  ui:
    name: "Control UI"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Install Playwright Chromium for changed browser tests
        if: needs.change-scope.outputs.changed_ui_browser_tests == 'true'
        run: pnpm --dir ui exec playwright install chromium

      - name: Run exact changed Control UI tests
        if: needs.change-scope.outputs.test_only == 'true'
        env:
          CHANGED_TEST_PATHS_JSON: ${{ needs.change-scope.outputs.changed_test_paths_json }}
        run: node scripts/ci-run-changed-tests.mjs ui

      - name: Install Playwright Chromium for Control UI suite
        if: needs.change-scope.outputs.test_only != 'true'
        run: pnpm --dir ui exec playwright install chromium

      - name: Build Control UI
        if: needs.change-scope.outputs.test_only != 'true'
        run: pnpm ui:build

      - name: Run Control UI Node tests
        if: needs.change-scope.outputs.test_only != 'true'
        run: pnpm --dir ui test:node

      - name: Run Control UI browser tests
        if: needs.change-scope.outputs.test_only != 'true'
        run: pnpm test:ui

      - name: Upload full UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots-${{ github.run_id }}
          if-no-files-found: ignore
          path: ui/src/**/__screenshots__/

  # Report-only dead-code scans. Runs after scope detection and stores machine-readable
  # results as artifacts for later triage before we enable hard gates.
  # Temporarily disabled in CI while we process initial findings.
  deadcode:
    name: dead-code report
    needs: [change-scope]
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: knip
            command: pnpm deadcode:report:ci:knip
          - tool: ts-prune
            command: pnpm deadcode:report:ci:ts-prune
          - tool: ts-unused-exports
            command: pnpm deadcode:report:ci:ts-unused
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run ${{ matrix.tool }} dead-code scan
        run: ${{ matrix.command }}

      - name: Upload dead-code results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dead-code-${{ matrix.tool }}-${{ github.run_id }}
          path: .artifacts/deadcode

  # Validate docs (format, lint, broken links) only when docs files changed.
  check-docs:
    needs: [change-scope]
    if: >-
      needs.change-scope.outputs.docs_changed == 'true' &&
      needs.change-scope.outputs.version_only != 'true' &&
      needs.change-scope.outputs.run_node_focused != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check docs
        run: pnpm check:docs

  skills-python:
    needs: [change-scope]
    if: needs.change-scope.outputs.run_skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pyyaml

      - name: Lint Python skill scripts
        run: python -m ruff check skills

      - name: Test skill Python scripts
        run: python -m pytest -q skills

  secrets:
    if: github.event_name != 'workflow_dispatch' || inputs.archive_branch_proof != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Resolve changed-file audit base
        id: audit-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" = "push" ]]; then
            base="$PUSH_BEFORE"
          else
            base="$PR_BASE_SHA"
          fi
          if [[ ! "$base" =~ ^[a-f0-9]{40}$ ]] || [[ "$base" = "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Detect secrets
        run: pre-commit run detect-secrets --from-ref "${{ steps.audit-base.outputs.base }}" --to-ref HEAD

      - name: Detect committed private keys
        run: pre-commit run detect-private-key --from-ref "${{ steps.audit-base.outputs.base }}" --to-ref HEAD

      - name: Audit changed GitHub workflows with zizmor
        env:
          BASE: ${{ steps.audit-base.outputs.base }}
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(git diff --name-only "$BASE" HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "No workflow changes detected; skipping zizmor."
            exit 0
          fi

          pre-commit run zizmor --files "${workflow_files[@]}"

  # Native Windows is not a supported Fased runtime. Windows users run the
  # Linux product through WSL2, whose contracts execute in Linux lanes.
  macos-runtime:
    name: "macOS runtime"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_macos_runtime == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run affected Darwin and launchd contracts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm exec vitest run
          scripts/install-platform-preflight.test.ts
          scripts/install-release-pin.test.ts
          src/daemon/launchd.test.ts
          src/daemon/runtime-paths.test.ts
          src/commands/doctor-platform-notes.launchctl-env-overrides.test.ts
          --pool=forks
          --maxWorkers=1

  macos-app:
    name: "macOS app"
    needs: [change-scope]
    if: needs.change-scope.outputs.run_macos_app == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version

      - name: Install Swift lint tools
        run: brew install swiftlint swiftformat

      - name: Swift lint
        run: |
          swiftlint --config .swiftlint.yml
          swiftformat --lint apps/macos/Sources --config .swiftformat
          swiftformat --lint apps/shared/FasedAgentKit/Sources --config .swiftformat
          swiftformat --lint Swabble/Sources --config .swiftformat

      - name: Cache SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('apps/macos/Package.resolved', 'Swabble/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Swift build and test
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --configuration release
          swift test --package-path apps/macos
          swift test --package-path apps/shared/FasedAgentKit
          swift test --package-path Swabble

  required-checks:
    name: "checks"
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.archive_branch_proof != true)
    needs:
      - change-scope
      - ci-contracts
      - t2-contracts
      - node-focused
      - node-unit
      - node-gateway
      - node-extensions
      - dependency-integrity
      - check
      - hosting-lifecycle
      - version-identity
      - strict-types-baseline
      - checks
      - build-artifacts
      - release-check
      - packed-core-smoke
      - signer-platform
      - signer-integration
      - signer-darwin-integration
      - docker-amd64
      - docker-arm64
      - codeql-javascript
      - codeql-go
      - codeql-python
      - ui-mining
      - ui
      - macos-runtime
      - macos-app
      - check-docs
      - skills-python
      - secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate evaluator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Require every applicable release gate
        env:
          DOCS_CHANGED: ${{ needs.change-scope.outputs.docs_changed }}
          FOCUSED_LOCAL_UPDATE: ${{ needs.change-scope.outputs.focused_local_update }}
          VERSION_ONLY: ${{ needs.change-scope.outputs.version_only }}
          DEPENDENCY_REMEDIATION: ${{ needs.change-scope.outputs.dependency_remediation }}
          MANUAL_REVIEW_REQUIRED: ${{ needs.change-scope.outputs.manual_review_required }}
          RUN_NODE_FOCUSED: ${{ needs.change-scope.outputs.run_node_focused }}
          RUN_NODE_UNIT: ${{ needs.change-scope.outputs.run_node_unit }}
          RUN_NODE_GATEWAY: ${{ needs.change-scope.outputs.run_node_gateway }}
          RUN_NODE_EXTENSIONS: ${{ needs.change-scope.outputs.run_node_extensions }}
          RUN_DEPENDENCY_INTEGRITY: ${{ needs.change-scope.outputs.run_dependency_integrity }}
          RUN_NODE_BUILD: ${{ needs.change-scope.outputs.run_node_build }}
          RUN_NODE_PACKAGING: ${{ needs.change-scope.outputs.run_node_packaging }}
          RUN_NODE_FULL: ${{ needs.change-scope.outputs.run_node_full }}
          RUN_NATIVE_SIGNER: ${{ needs.change-scope.outputs.run_native_signer }}
          RUN_SIGNER_INTEGRATION: ${{ needs.change-scope.outputs.run_signer_integration }}
          RUN_SIGNER_DARWIN_INTEGRATION: ${{ needs.change-scope.outputs.run_signer_darwin_integration }}
          RUN_DOCKER: ${{ needs.change-scope.outputs.run_docker }}
          RUN_CODEQL_JAVASCRIPT: ${{ needs.change-scope.outputs.run_codeql_javascript }}
          RUN_CODEQL_GO: ${{ needs.change-scope.outputs.run_codeql_go }}
          RUN_CODEQL_PYTHON: ${{ needs.change-scope.outputs.run_codeql_python }}
          RUN_HOSTING: ${{ needs.change-scope.outputs.run_hosting }}
          RUN_CI_CONTRACTS: ${{ needs.change-scope.outputs.run_ci_contracts }}
          RUN_T2_CONTRACTS: ${{ needs.change-scope.outputs.run_t2_contracts }}
          RUN_UI_MINING: ${{ needs.change-scope.outputs.run_ui_mining }}
          RUN_UI: ${{ needs.change-scope.outputs.run_ui }}
          RUN_SKILLS: ${{ needs.change-scope.outputs.run_skills }}
          RUN_MACOS_RUNTIME: ${{ needs.change-scope.outputs.run_macos_runtime }}
          RUN_MACOS_APP: ${{ needs.change-scope.outputs.run_macos_app }}
          CHANGE_SCOPE: ${{ needs.change-scope.result }}
          CHECK: ${{ needs.check.result }}
          HOSTING: ${{ needs.hosting-lifecycle.result }}
          CI_CONTRACTS: ${{ needs.ci-contracts.result }}
          T2_CONTRACTS: ${{ needs.t2-contracts.result }}
          VERSION_IDENTITY: ${{ needs.version-identity.result }}
          STRICT_TYPES: ${{ needs.strict-types-baseline.result }}
          FOCUSED_TESTS: ${{ needs.node-focused.result }}
          NODE_UNIT_TESTS: ${{ needs.node-unit.result }}
          NODE_GATEWAY_TESTS: ${{ needs.node-gateway.result }}
          NODE_EXTENSION_TESTS: ${{ needs.node-extensions.result }}
          DEPENDENCY_INTEGRITY: ${{ needs.dependency-integrity.result }}
          TESTS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build-artifacts.result }}
          RELEASE: ${{ needs.release-check.result }}
          PACKED_CORE: ${{ needs.packed-core-smoke.result }}
          SIGNER: ${{ needs.signer-platform.result }}
          SIGNER_INTEGRATION: ${{ needs.signer-integration.result }}
          SIGNER_DARWIN_INTEGRATION: ${{ needs.signer-darwin-integration.result }}
          DOCKER_AMD64: ${{ needs.docker-amd64.result }}
          DOCKER_ARM64: ${{ needs.docker-arm64.result }}
          CODEQL_JAVASCRIPT: ${{ needs.codeql-javascript.result }}
          CODEQL_GO: ${{ needs.codeql-go.result }}
          CODEQL_PYTHON: ${{ needs.codeql-python.result }}
          UI_MINING: ${{ needs.ui-mining.result }}
          UI: ${{ needs.ui.result }}
          MACOS_RUNTIME: ${{ needs.macos-runtime.result }}
          MACOS_APP: ${{ needs.macos-app.result }}
          DOCS: ${{ needs.check-docs.result }}
          SKILLS: ${{ needs.skills-python.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: node scripts/ci-required-gates.mjs
