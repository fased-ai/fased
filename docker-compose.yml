services:
  fased-gateway:
    image: ${FASED_IMAGE:-fased:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      FASED_GATEWAY_TOKEN: ${FASED_GATEWAY_TOKEN}
    volumes:
      - ${FASED_CONFIG_DIR}:/home/node/.fased
      - ${FASED_WORKSPACE_DIR}:/home/node/.fased/workspace
    ports:
      - "${FASED_GATEWAY_PORT:-18789}:18789"
      - "${FASED_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${FASED_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  fased-cli:
    image: ${FASED_IMAGE:-fased:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      FASED_GATEWAY_TOKEN: ${FASED_GATEWAY_TOKEN}
      BROWSER: echo
    volumes:
      - ${FASED_CONFIG_DIR}:/home/node/.fased
      - ${FASED_WORKSPACE_DIR}:/home/node/.fased/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
