services:
  fased-gateway:
    image: ${FASED_IMAGE:-fased:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      FASED_GATEWAY_TOKEN: ${FASED_GATEWAY_TOKEN}
    volumes:
      - ${FASED_CONFIG_DIR}:/home/node/.fased
      - ${FASED_WORKSPACE_DIR}:/home/node/.fased/workspace
    ports:
      - "127.0.0.1:${FASED_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${FASED_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${FASED_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  fased-cli:
    image: ${FASED_IMAGE:-fased:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      FASED_GATEWAY_TOKEN: ${FASED_GATEWAY_TOKEN}
      BROWSER: echo
    volumes:
      - ${FASED_CONFIG_DIR}:/home/node/.fased
      - ${FASED_WORKSPACE_DIR}:/home/node/.fased/workspace
    stdin_open: true
    tty: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "dist/index.js"]
